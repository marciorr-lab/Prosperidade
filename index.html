// Descrições da conta corrente que indicam pagamento de fatura de cartão (ignoradas na importação para não contar em dobro).
const CARD_PAYMENT_RE = /(pag(amento|to)?|pgto|debito)\s+(de\s+|do\s+|da\s+)?(fatura|cartao)|fatura\s+(do\s+)?cartao|cartao\s+de\s+credito|(fatura|pag\w*)[^\n]*\b(visa|mastercard|master)\b/;

// Mês (0-11) e ano em que a compra será debitada, dado o dia de fechamento do cartão.
// Compra até o dia de fechamento -> debita no mês seguinte; depois do fechamento -> daqui a 2 meses.
function billingMonth(dateStr, closeDay = 31) {
  const d = new Date(dateStr + "T12:00:00");
  let m = d.getMonth() + 1 + (d.getDate() > closeDay ? 1 : 0);
  let y = d.getFullYear();
  while (m > 11) { m -= 12; y++; }
  return { month:m, year:y };
}
function closeDayOf(pmId) { return PMS.find(p=>p.id===pmId)?.closeDay ?? 31; }
function billingFor(dateStr, pmId) { return billingMonth(dateStr, closeDayOf(pmId)); }

// Converte "1.234,56", "1234.56", "R$ 1.234,56" etc. em número (sempre positivo).
function parseAmount(v) {
  let s = String(v ?? "").trim();
  if (!s) return 0;
  s = s.replace(/[^0-9.,]/g, "");
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) {
    s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if (lc > -1) {
    s = (s.match(/,/g) || []).length === 1 ? s.replace(",", ".") : s.replace(/,/g, "");
  } else if (ld > -1) {
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : Math.abs(n);
}

// Aceita AAAA-MM-DD, DD/MM/AAAA e DD/MM/AA.
function parseDateStr(raw) {
  const t = String(raw ?? "").trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1]+"-"+m[2]+"-"+m[3];
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    const y = m[3].length === 2 ? "20"+m[3] : m[3];
    return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  }
  return t;
}

// Chave para detectar lançamento já importado.
function dupKey(r) {
  return [
    r.date,
    String(r.desc || "").trim().toLowerCase().replace(/\s+/g, " "),
    Number(r.amount).toFixed(2),
    r.kind === "entrada" ? "entrada" : (r.pm || "corrente")
  ].join("|");
}

function normalizeDesc(s) {
  return (s||"")
    .toString()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[0-9]/g,"")
    .replace(/[^a-z\s]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

        </div>
      </div>
    </div>
  );
}

function MainApp({user, onLogout}) {

  const [reviewRows,setReviewRows]= useState([]);
  const [importErr, setImportErr] = useState("");
  const [bulkBill, setBulkBill] = useState({month:now.getMonth(), year:now.getFullYear()});

  const today = now.toISOString().split("T")[0];
  const [ef,   setEf]   = useState({desc:"",amt:"",cat:"mercado",pm:"corrente",person:"p1",date:today});
  const [inf,  setInf]  = useState({desc:"",amt:"",type:"salario",person:"p1",date:today});
  const [invF, setInvF] = useState({accId:"",amt:"",month:now.getMonth(),year:now.getFullYear()});
  const [newA, setNewA] = useState({name:"",inst:"",bal:""});

  const flash    = msg => { setOk(msg);    setTimeout(()=>setOk(""),   2500); };
  const flashInv = msg => { setInvOk(msg); setTimeout(()=>setInvOk(""),2500); };

  useEffect(()=>{
    let n=0; const done=()=>{ n++; if(n>=5) setLoading(false); };

        : "Erro ao carregar os dados ("+((err&&err.code)||"desconhecido")+").");
      done();
    };
    const u1=db.collection("expenses").orderBy("date","desc").onSnapshot(s=>{setExpenses(s.docs.map(d=>({id:d.id,...d.data()}))); done();},onErr);
    const u2=db.collection("incomes").orderBy("date","desc").onSnapshot(s=>{setIncomes(s.docs.map(d=>({id:d.id,...d.data()}))); done();},onErr);
    const u3=db.collection("accounts").onSnapshot(s=>{setAccounts(s.docs.map(d=>({id:d.id,...d.data()}))); done();},onErr);
    const u4=db.collection("contribs").orderBy("date","desc").onSnapshot(s=>{setContribs(s.docs.map(d=>({id:d.id,...d.data()}))); done();},onErr);
    const u5=db.collection("categoryRules").onSnapshot(s=>{setCatRules(s.docs.map(d=>({id:d.id,...d.data()}))); done();},onErr);
    return ()=>{u1();u2();u3();u4();u5();};
  },[]);

  const mExp       = useMemo(()=>expenses.filter(e=>e.month===month&&e.year===year),[expenses,month,year]);
  const debitExp   = useMemo(()=>expenses.filter(e=>{ if(!e.isCard) return e.month===month&&e.year===year; return e.billMonth===month&&e.billYear===year; }),[expenses,month,year]);
  const nextM      = month===11?0:month+1;
  const nextY      = month===11?year+1:year;
  const pendingCard= useMemo(()=>expenses.filter(e=>e.isCard&&e.billMonth===nextM&&e.billYear===nextY),[expenses,nextM,nextY]);
  const mInc       = useMemo(()=>incomes.filter(i=>i.month===month&&i.year===year),[incomes,month,year]);
  const totDebit   = debitExp.reduce((s,e)=>s+e.amount,0);
  const totMExp    = debitExp.reduce((s,e)=>s+e.amount,0);
  const totInc     = mInc.reduce((s,i)=>s+i.amount,0);
  const totPending = pendingCard.reduce((s,e)=>s+e.amount,0);
  const bal        = totInc - totDebit;

  const fPmIsCard = PMS.find(p=>p.id===fPm)?.isCard||false;
  // Ao filtrar por um cartão, a lista segue o MÊS DA FATURA (billMonth/billYear), não o mês da compra.
  const fBase = useMemo(()=> fPmIsCard ? expenses.filter(e=>e.isCard&&e.billMonth===month&&e.billYear===year) : mExp,[fPmIsCard,expenses,mExp,month,year]);
  const existingKeyCount = useMemo(()=>{
    const m={};
    expenses.forEach(e=>{ const k=dupKey({date:e.date,desc:e.desc,amount:e.amount,kind:"gasto",pm:e.pm}); m[k]=(m[k]||0)+1; });
    incomes.forEach(i=>{ const k=dupKey({date:i.date,desc:i.desc,amount:i.amount,kind:"entrada"}); m[k]=(m[k]||0)+1; });
    return m;
  },[expenses,incomes]);
  // Para cada linha da revisão: é duplicata de algo já gravado? é inválida? será ignorada?
  // Contagem por ocorrência: duas compras idênticas no mesmo dia continuam valendo (só ignora o que já existe no banco).
  const rowStatus = useMemo(()=>{
    const seen={};
    return reviewRows.map(r=>{
      const k=dupKey(r); const n=seen[k]||0; seen[k]=n+1;
      const dup=(existingKeyCount[k]||0)>n;
      const isC = PMS.find(p=>p.id===r.pm)?.isCard;
      const payment = r.kind==="gasto" && !isC && CARD_PAYMENT_RE.test(r.norm||"");
      return {dup, payment, invalid:!!r.invalid, skip: !!r.invalid || ((dup||payment) && !r.forceInclude)};
    });
  },[reviewRows,existingKeyCount]);

  const importBatches = useMemo(()=>{
    const m={};
    const add=(kind,d)=>{
      if(d.importedFrom!=="import") return;
      const id=d.importBatchId||("legacy_"+String(d.createdAt||"").slice(0,16));
      if(!m[id]) m[id]={id,legacy:!d.importBatchId,createdAt:d.createdAt||"",exp:[],inc:[],gTotal:0,iTotal:0,pms:{},faturas:{}};
      const b=m[id];
      if(d.createdAt && (!b.createdAt || d.createdAt<b.createdAt)) b.createdAt=d.createdAt;
      if(kind==="exp"){ b.exp.push(d.id); b.gTotal+=d.amount; b.pms[d.pm]=1; if(d.isCard&&d.billMonth!=null) b.faturas[MONTHS[d.billMonth]+"/"+d.billYear]=1; }
      else { b.inc.push(d.id); b.iTotal+=d.amount; }
    };
    expenses.forEach(e=>add("exp",e));
    incomes.forEach(i=>add("inc",i));
    return Object.values(m).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,8);
  },[expenses,incomes]);

  const fExp = useMemo(()=>fBase.filter(e=>(fCat==="all"||e.cat===fCat)&&(fPm==="all"||e.pm===fPm)&&(fPer==="all"||e.person===fPer)),[fBase,fCat,fPm,fPer]);
  const fInc = useMemo(()=>mInc.filter(i=>(fPer==="all"||i.person===fPer)&&(fType==="all"||i.type===fType)),[mInc,fPer,fType]);

  const byCat  = useMemo(()=>{const m={};debitExp.forEach(e=>{m[e.cat]=(m[e.cat]||0)+e.amount});return CATS.map(c=>({...c,total:m[c.id]||0})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);},[debitExp]);
  const byType = useMemo(()=>{const m={};mInc.forEach(i=>{m[i.type]=(m[i.type]||0)+i.amount});return ITYPES.map(t=>({...t,total:m[t.id]||0})).filter(t=>t.total>0).sort((a,b)=>b.total-a.total);},[mInc]);

  const pDebit = p => debitExp.filter(e=>e.person===p).reduce((s,e)=>s+e.amount,0);
  const pInc   = p => mInc.filter(i=>i.person===p).reduce((s,i)=>s+i.amount,0);

  const prevM     = month===0?11:month-1;
  const prevY     = month===0?year-1:year;
  const prevDebit = expenses.filter(e=>{ if(!e.isCard) return e.month===prevM&&e.year===prevY; return e.billMonth===prevM&&e.billYear===prevY; });
  const prevInc   = incomes.filter(i=>i.month===prevM&&i.year===prevY);
  const prevT     = prevDebit.reduce((s,e)=>s+e.amount,0);
  const prevI     = prevInc.reduce((s,i)=>s+i.amount,0);
  const prevExpByLaunch = prevDebit;
  const prevBC    = useMemo(()=>{const m={};prevExpByLaunch.forEach(e=>{m[e.cat]=(m[e.cat]||0)+e.amount});return m;},[prevExpByLaunch]);
  const diff      = totDebit-prevT;
  const diffP     = prevT>0?((diff/prevT)*100).toFixed(1):null;

  const totInv   = accounts.reduce((s,a)=>s+a.balance,0);
  const totContr = contribs.reduce((s,c)=>s+c.amount,0);
  const cByM = useMemo(()=>{
    const m={};
    contribs.forEach(c=>{const k=c.year+"-"+String(c.month).padStart(2,"0");m[k]=(m[k]||0)+c.amount;});
    return Object.entries(m).sort(([a],[b])=>a.localeCompare(b)).map(([k,t])=>{const[y,mo]=k.split("-");return{label:MONTHS[parseInt(mo)]+" "+y,total:t};});
  },[contribs]);
  const maxC    = cByM.reduce((m,c)=>Math.max(m,c.total),1);
  const maxCat  = byCat.length>0?byCat[0].total:1;
  const maxType = byType.length>0?byType[0].total:1;

  const addExp = async()=>{
    if(!ef.desc||!ef.amt||parseFloat(ef.amt)<=0) return;
    setSyncing(true);
    const d = new Date(ef.date+"T12:00:00");
    const isCard = PMS.find(p=>p.id===ef.pm)?.isCard||false;
    const bill = isCard ? billingFor(ef.date, ef.pm) : null;
    await db.collection("expenses").add({
      date:ef.date, month:d.getMonth(), year:d.getFullYear(),
      desc:ef.desc, cat:ef.cat, pm:ef.pm, person:ef.person,
      amount:parseFloat(parseFloat(ef.amt).toFixed(2)),
      isCard,
      billMonth: isCard?bill.month:null,
      billYear:  isCard?bill.year:null,
      createdAt: new Date().toISOString()
    });
    setEf(f=>({...f,desc:"",amt:""}));
    setSyncing(false);
    flash(isCard?"Cartão lançado! Débito em "+MONTHS[bill.month]+" ✓":"Gasto lançado! ✓");
  };

  const addInc = async()=>{
    if(!inf.desc||!inf.amt||parseFloat(inf.amt)<=0) return;
    setSyncing(true);
    const d=new Date(inf.date+"T12:00:00");
    await db.collection("incomes").add({
      date:inf.date,month:d.getMonth(),year:d.getFullYear(),
      desc:inf.desc,type:inf.type,person:inf.person,
      amount:parseFloat(parseFloat(inf.amt).toFixed(2)),
      createdAt:new Date().toISOString()
    });
    setInf(f=>({...f,desc:"",amt:""}));
    setSyncing(false);
    flash("Entrada registrada! ✓");
  };

  const updateExp = async()=>{
    if(!editExp||!editExp.desc||!editExp.amt||parseFloat(editExp.amt)<=0) return;
    setSyncing(true);
    const d = new Date(editExp.date+"T12:00:00");
    const isCard = PMS.find(p=>p.id===editExp.pm)?.isCard||false;
    const origE = expenses.find(x=>x.id===editExp.id);
    const keepBill = isCard && origE && origE.isCard && origE.billMonth!=null && origE.billYear!=null && origE.date===editExp.date;
    const bill = keepBill ? {month:origE.billMonth, year:origE.billYear} : (isCard ? billingFor(editExp.date, editExp.pm) : null);
    await db.collection("expenses").doc(editExp.id).update({
      date:editExp.date, month:d.getMonth(), year:d.getFullYear(),
      desc:editExp.desc, cat:editExp.cat, pm:editExp.pm, person:editExp.person,
      amount:parseFloat(parseFloat(editExp.amt).toFixed(2)),
      isCard,
      billMonth: isCard?bill.month:null,
      billYear:  isCard?bill.year:null,
    });
    setEditExp(null); setSyncing(false);
    flash("Gasto atualizado! ✓");
  };

  const updateInc = async()=>{
    if(!editInc||!editInc.desc||!editInc.amt||parseFloat(editInc.amt)<=0) return;
    setSyncing(true);
    const d=new Date(editInc.date+"T12:00:00");
    await db.collection("incomes").doc(editInc.id).update({
      date:editInc.date, month:d.getMonth(), year:d.getFullYear(),
      desc:editInc.desc, type:editInc.type, person:editInc.person,
      amount:parseFloat(parseFloat(editInc.amt).toFixed(2)),
    });
    setEditInc(null); setSyncing(false);
    flash("Entrada atualizada! ✓");
  };

  const delExp = async id=>await db.collection("expenses").doc(id).delete();
  const delInc = async id=>await db.collection("incomes").doc(id).delete();
  const delAcc = async id=>await db.collection("accounts").doc(id).delete();

  const addAcc = async()=>{
    if(!newA.name||!newA.bal) return;
    setSyncing(true);
    const cols=["#F59E0B","#6C5CE7","#10B981","#3B82F6","#EC4899","#FF6B35"];
    await db.collection("accounts").add({
      name:newA.name, inst:newA.inst,
      color:cols[accounts.length%cols.length],
      balance:parseFloat(parseFloat(newA.bal).toFixed(2)),
      createdAt:new Date().toISOString()
    });
    setNewA({name:"",inst:"",bal:""});
    setShowAcc(false); setSyncing(false);
    flashInv("Conta adicionada! ✓");
  };

  const addContr = async()=>{
    if(!invF.accId||!invF.amt||parseFloat(invF.amt)<=0) return;
    setSyncing(true);
    await db.collection("contribs").add({
      accId:invF.accId, month:parseInt(invF.month), year:parseInt(invF.year),
      amount:parseFloat(parseFloat(invF.amt).toFixed(2)),
      date:new Date().toISOString().split("T")[0],
      createdAt:new Date().toISOString()
    });
    setInvF(f=>({...f,amt:""})); setSyncing(false);
    flashInv("Aporte registrado! ✓");
  };

  // ── IMPORTAÇÃO EM MASSA ──
  const buildRows = rawRows => {
    return rawRows
      .filter(r => r && (r.data || r.Data) && (r.descricao || r.Descricao || r.Descrição))
      .map((r,i) => {
        const get = (...keys)=>{ for(const k of keys){ if(r[k]!==undefined && r[k]!==null && r[k]!=="") return r[k]; } return ""; };
        const date     = parseDateStr(get("data","Data"));
        const desc     = String(get("descricao","Descricao","Descrição")).trim();
        const amount   = parseAmount(get("valor","Valor"));
        const kindRaw  = String(get("tipo","Tipo")).toLowerCase().trim();
        const kind     = kindRaw==="entrada" ? "entrada" : "gasto";
        const origem   = String(get("origem","Origem")).trim() || "corrente";
        const pmObj    = PMS.find(p=>p.id===origem) || PMS[0];
        const norm     = normalizeDesc(desc);
        const rule     = catRules.find(cr=>cr.norm===norm);
        const invalid  = !/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(new Date(date+"T12:00:00").getTime()) || !(amount>0);
        const isInstallment = /parcela\s*\d+\s*\/\s*\d+/i.test(desc);

        // Mês da fatura: o valor explícito do CSV (coluna "fatura", AAAA-MM) sempre vence.
        // Sem ele, calcula pelo dia de fechamento do cartão (billSource="auto") — o app avisa na revisão.
        let billMonth = null, billYear = null, billSource = null;
        if(pmObj.isCard && !invalid){
          const faturaRaw = String(get("fatura","Fatura")).trim();
          if(/^\d{4}-\d{2}$/.test(faturaRaw)){
            const [fy,fm] = faturaRaw.split("-");
            billYear = parseInt(fy,10); billMonth = parseInt(fm,10)-1; billSource = "csv";
          } else {
            const b = billingFor(date, pmObj.id);
            billMonth = b.month; billYear = b.year; billSource = "auto";
          }
        }

        return {
          _tmpId: "row_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
          date, desc, norm, amount, kind, invalid, isInstallment,
          pm: pmObj.id,
          billMonth, billYear, billSource,
          cat: (rule && rule.kind==="gasto") ? rule.cat : "outros",
          person: rule ? (rule.person||"p1") : "p1",
          incType: (rule && rule.kind==="entrada") ? (rule.incType||"salario") : "salario",
          matched: !!rule
        };
      });
  };

  // Carrega as linhas na revisão e sugere a fatura mais comum do arquivo para o seletor de lote.
  const loadRows = rows => {
    setReviewRows(rows);
    setExpTotals({});
    const cnt={};
    rows.forEach(r=>{ if(r.billMonth!=null&&r.billYear!=null){ const k=r.billYear+"-"+r.billMonth; cnt[k]=(cnt[k]||0)+1; } });
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top){ const [y,m]=top[0].split("-").map(Number); setBulkBill({month:m,year:y}); }
  };

  const handleFile = e => {
    const file = e.target.files[0];
    if(!file) return;
    setImportErr("");
    const ext = file.name.split(".").pop().toLowerCase();
    if(ext==="csv"){
      Papa.parse(file, {
        header:true, skipEmptyLines:true,
        complete: res => {
          if(!res.data || res.data.length===0){ setImportErr("Não encontrei linhas válidas no arquivo."); return; }
          loadRows(buildRows(res.data));
        },
        error: () => setImportErr("Não consegui ler esse CSV. Confira o formato.")
      });
    } else if(ext==="xlsx" || ext==="xls"){
      const reader = new FileReader();
      reader.onload = evt => {
        try{
          const wb = XLSX.read(evt.target.result, {type:"binary"});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet, {raw:false});
          if(!json || json.length===0){ setImportErr("Não encontrei linhas válidas na planilha."); return; }
          loadRows(buildRows(json));
        }catch(err){ setImportErr("Não consegui ler essa planilha. Confira o formato."); }
      };
      reader.readAsBinaryString(file);
    } else {
      setImportErr("Formato não suportado. Envie um arquivo .csv ou .xlsx.");
    }
    e.target.value = "";
  };

  const updateRow = (idx, patch) => setReviewRows(rows => rows.map((r,i)=> i===idx ? {...r,...patch} : r));
  const removeRow = idx => setReviewRows(rows => rows.filter((_,i)=>i!==idx));
  const clearImport = () => { setReviewRows([]); setImportErr(""); setExpTotals({}); };

  const confirmImport = async () => {
    const rows = reviewRows.filter((_,i)=>!(rowStatus[i]&&rowStatus[i].skip));
    const skipped = reviewRows.length - rows.length;
    if(rows.length===0){ setImportErr("Nada novo para importar: todas as linhas são duplicadas, pagamentos de fatura ou inválidas."); return; }
    const mism = importSummary.filter(g=>{ const t=expTotals[g.key]; if(t===undefined||String(t).trim()==="") return false; return Math.abs(g.fileTotal-parseAmount(t))>=0.005; });
    if(mism.length>0 && !window.confirm("O total de "+mism.map(g=>g.label).join("; ")+" não bate com o valor que você informou. Importar mesmo assim?")) return;
    setSyncing(true); setImportErr("");
    try{
      const batchId = "imp_"+Date.now().toString(36);
      const ops = [];
      const rulesToSave = {};
      rows.forEach(row=>{
        const d = new Date(row.date+"T12:00:00");
        if(row.kind==="gasto"){
          const ref = db.collection("expenses").doc();
          const isCard = PMS.find(p=>p.id===row.pm)?.isCard||false;
          let billMonth = row.billMonth, billYear = row.billYear;
          if(isCard && (billMonth==null || billYear==null)){
            const b = billingFor(row.date, row.pm); billMonth=b.month; billYear=b.year;
          }
          ops.push({ref, data:{
            date:row.date, month:d.getMonth(), year:d.getFullYear(),
            desc:row.desc, cat:row.cat, pm:row.pm, person:row.person,
            amount: parseFloat(row.amount.toFixed(2)),
            isCard, billMonth:isCard?billMonth:null, billYear:isCard?billYear:null,
            createdAt:new Date().toISOString(), importedFrom:"import", importBatchId:batchId
          }});
        } else {
          const ref = db.collection("incomes").doc();
          ops.push({ref, data:{
            date:row.date, month:d.getMonth(), year:d.getFullYear(),
            desc:row.desc, type:row.incType, person:row.person,
            amount: parseFloat(row.amount.toFixed(2)),
            createdAt:new Date().toISOString(), importedFrom:"import", importBatchId:batchId
          }});
        }
        if(row.norm){
          rulesToSave[row.norm] = {norm:row.norm, kind:row.kind, cat:row.cat, person:row.person, incType:row.incType};
        }
      });
      // O Firestore aceita no máximo 500 operações por batch: grava em blocos de 400.
      for(let i=0;i<ops.length;i+=400){
        const b = db.batch();
        ops.slice(i,i+400).forEach(o=>b.set(o.ref,o.data));
        await b.commit();
      }

      const ruleList = Object.values(rulesToSave);
      for(let i=0;i<ruleList.length;i+=400){
        const rb = db.batch();
        ruleList.slice(i,i+400).forEach(rule=>{
          const docId = rule.norm.replace(/\s+/g,"_").slice(0,140) || "_vazio";
          rb.set(db.collection("categoryRules").doc(docId), rule, {merge:true});
        });
        await rb.commit();
      }

      setReviewRows([]);
      setExpTotals({});
      setSyncing(false);
      flash(rows.length+" lançamentos importados"+(skipped?" ("+skipped+" ignorados)":"")+"! ✓");
    }catch(err){
      setSyncing(false);
      setImportErr("Erro ao salvar a importação. Confira o que já entrou antes de tentar de novo — duplicados serão ignorados automaticamente.");
    }
  };

  const undoImport = async b => {
    setSyncing(true); setImportErr("");
    try{
      const refs=[...b.exp.map(id=>db.collection("expenses").doc(id)),...b.inc.map(id=>db.collection("incomes").doc(id))];
      for(let i=0;i<refs.length;i+=400){
        const bt=db.batch();
        refs.slice(i,i+400).forEach(r=>bt.delete(r));
        await bt.commit();
      }

                      <input type="number" value={bulkBill.year} onChange={e=>setBulkBill(b=>({...b,year:parseInt(e.target.value,10)||b.year}))} style={{...SS,width:72}}/>

                        const isC=PMS.find(p=>p.id===r.pm)?.isCard;
                        return (isC && r.billSource!=="csv" && r.billSource!=="manual" && !r.invalid) ? {...r,billMonth:bulkBill.month,billYear:bulkBill.year,billSource:"lote"} : r;
                      }))} style={{background:"#B7791F",border:"none",borderRadius:10,padding:"9px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>Aplicar</button>

                  <div key={row._tmpId} style={{background:"#fff",borderRadius:14,padding:"12px 14px",marginBottom:8,boxShadow:shadow,border:"1px solid "+(rowStatus[idx]&&rowStatus[idx].skip?"#F5C6C2":"#EBEBEB"),opacity:rowStatus[idx]&&rowStatus[idx].skip?0.55:1}}>

                      <div style={{fontSize:14,fontWeight:800,color:row.kind==="gasto"?"#E8544A":"#00A86B",flexShrink:0}}>{row.kind==="gasto"?"-":"+"}{fmt(row.amount)}</div>
                    </div>
                    {row.matched&&<div style={{fontSize:10,color:"#6C5CE7",background:"#F5F0FF",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:600}}>✓ categoria aprendida</div>}
                    {rowStatus[idx]&&rowStatus[idx].invalid&&<div style={{fontSize:10,color:"#E8544A",background:"#FFF0EF",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:700}}>✕ data ou valor inválido — será ignorada</div>}

                      <div style={{display:"inline-flex",alignItems:"center",gap:6,marginBottom:8,marginRight:6}}>
                        <span style={{fontSize:10,color:"#E8544A",background:"#FFF0EF",padding:"2px 8px",borderRadius:20,fontWeight:700}}>⚠ já importado</span>
                        <button onClick={()=>updateRow(idx,{forceInclude:!row.forceInclude})} style={{fontSize:10,background:"transparent",border:"1px solid #E8E8E8",borderRadius:20,padding:"2px 8px",color:"#8E8E9A",cursor:"pointer",fontWeight:600}}>{row.forceInclude?"Ignorar":"Importar mesmo assim"}</button>
                      </div>
                    )}
                    {rowStatus[idx]&&rowStatus[idx].payment&&!rowStatus[idx].invalid&&(
                      <div style={{display:"inline-flex",alignItems:"center",gap:6,marginBottom:8,marginRight:6}}>
                        <span style={{fontSize:10,color:"#6C5CE7",background:"#F5F0FF",padding:"2px 8px",borderRadius:20,fontWeight:700}}>💳 pagamento de fatura — ignorado (evita contar em dobro)</span>
                        <button onClick={()=>updateRow(idx,{forceInclude:!row.forceInclude})} style={{fontSize:10,background:"transparent",border:"1px solid #E8E8E8",borderRadius:20,padding:"2px 8px",color:"#8E8E9A",cursor:"pointer",fontWeight:600}}>{row.forceInclude?"Ignorar":"Importar mesmo assim"}</button>
                      </div>
                    )}
                    {PMS.find(p=>p.id===row.pm)?.isCard&&row.billSource==="auto"&&<div style={{fontSize:10,color:"#B7791F",background:"#FFF8E6",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:600}}>{row.isInstallment?"parcela — confira a fatura":"fatura estimada"}</div>}
                    {PMS.find(p=>p.id===row.pm)?.isCard&&row.billSource==="lote"&&<div style={{fontSize:10,color:"#6C5CE7",background:"#F5F0FF",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:600}}>fatura do lote</div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      <select value={row.kind} onChange={e=>updateRow(idx,{kind:e.target.value})} style={SS}>
                        <option value="gasto">↓ Gasto</option>
                        <option value="entrada">↑ Entrada</option>
                      </select>
                      <select value={row.person} onChange={e=>updateRow(idx,{person:e.target.value})} style={SS}>
                        {PERSONS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      {row.kind==="gasto"
                        ? <select value={row.cat} onChange={e=>updateRow(idx,{cat:e.target.value})} style={SS}>
                            {CATS.map(c=><option key={c.id} value={c.id}>{c.e} {c.l}</option>)}
                          </select>
                        : <select value={row.incType} onChange={e=>updateRow(idx,{incType:e.target.value})} style={SS}>

                          </select>
                      }
                      <select value={row.pm} onChange={e=>{
                        const newPm = e.target.value;
                        const isCard = PMS.find(p=>p.id===newPm)?.isCard||false;
                        const patch = {pm:newPm};
                        if(isCard && (row.billMonth==null||row.billYear==null)){
                          const b = billingFor(row.date, newPm);
                          patch.billMonth = b.month; patch.billYear = b.year; patch.billSource = "auto";

                        updateRow(idx,patch);
                      }} style={SS}>

                          <select value={row.billMonth ?? ""} onChange={e=>updateRow(idx,{billMonth:parseInt(e.target.value,10),billSource:"manual"})} style={SS} title="Mês da fatura">
                            {MONTHS.map((m,i)=><option key={i} value={i}>Fatura {m}</option>)}
                          </select>
                          <input type="number" value={row.billYear ?? ""} onChange={e=>updateRow(idx,{billYear:parseInt(e.target.value,10),billSource:"manual"})} style={{...SS,width:72}} title="Ano da fatura"/>
                        </>
                      )}
                      <button onClick={()=>removeRow(idx)} style={{background:"transparent",border:"none",color:"#D1D1D1",fontSize:16,cursor:"pointer",marginLeft:"auto"}}>🗑️</button>
                    </div>
                  </div>
                ))}

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:14}}>
                  <button onClick={clearImport} style={{background:"#F5F5F3",border:"none",borderRadius:14,padding:"15px",color:"#1a1a2e",fontSize:15,fontWeight:700,cursor:"pointer"}}>Cancelar</button>
                  <button onClick={confirmImport} disabled={syncing} style={{background:"#6C5CE7",border:"none",borderRadius:14,padding:"15px",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 14px rgba(108,92,231,0.35)",opacity:syncing?0.6:1}}>{syncing?"Salvando...":"Confirmar Importação"}</button>
                </div>
              </>
            )}

            <div style={{background:"#fff",borderRadius:16,padding:16,marginTop:14,boxShadow:shadow,border:"1px solid #EBEBEB"}}>
              <div style={{fontSize:11,color:"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Importações recentes</div>
              {importBatches.length===0&&<div style={{fontSize:12,color:"#8E8E9A"}}>Nenhuma importação encontrada.</div>}
              {importBatches.map(b=>{
                const when=b.createdAt?new Date(b.createdAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"data desconhecida";
                const pmsL=Object.keys(b.pms).map(id=>PMS.find(p=>p.id===id)?.l||id).join(", ");
                const fats=Object.keys(b.faturas).join(", ");
                return (
                  <div key={b.id} style={{padding:"10px 0",borderTop:"1px solid #F3F3F3"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{when}{b.legacy?" · importação antiga":""}</div>
                        <div style={{fontSize:11,color:"#8E8E9A",marginTop:2,lineHeight:1.5}}>
                          {b.exp.length>0&&<span>{b.exp.length} gastos · {fmt(b.gTotal)}{pmsL?" · "+pmsL:""}{fats?" · fatura "+fats:""}</span>}
                          {b.exp.length>0&&b.inc.length>0&&<br/>}
                          {b.inc.length>0&&<span>{b.inc.length} entradas · {fmt(b.iTotal)}</span>}
                        </div>
                      </div>
                      {undoId===b.id
                        ? <div style={{display:"flex",gap:6,flexShrink:0}}>
                            <button onClick={()=>setUndoId(null)} style={{background:"#F5F5F3",border:"none",borderRadius:10,padding:"7px 10px",fontSize:12,fontWeight:700,color:"#1a1a2e",cursor:"pointer"}}>Não</button>
                            <button disabled={syncing} onClick={()=>undoImport(b)} style={{background:"#E8544A",border:"none",borderRadius:10,padding:"7px 10px",fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer",opacity:syncing?0.6:1}}>Apagar {b.exp.length+b.inc.length}</button>
                          </div>
                        : <button onClick={()=>setUndoId(b.id)} style={{background:"transparent",border:"1px solid #F5C6C2",borderRadius:10,padding:"7px 10px",fontSize:12,fontWeight:700,color:"#E8544A",cursor:"pointer",flexShrink:0}}>Desfazer</button>}
                    </div>
                  </div>
                );
              })}
              <div style={{fontSize:10,color:"#B0B0C0",marginTop:8,lineHeight:1.5}}>Desfazer apaga todos os lançamentos daquela importação. As categorias aprendidas são mantidas.</div>
            </div>

            <div style={{background:"#fff",borderRadius:16,padding:16,marginTop:14,boxShadow:shadow,border:"1px solid #EBEBEB"}}>
              <div style={{fontSize:11,color:"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Backup e conta</div>
              <button onClick={downloadBackup} style={{background:"#1a1a2e",border:"none",borderRadius:14,padding:"13px",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",width:"100%"}}>⬇ Baixar backup (JSON)</button>
              <div style={{fontSize:11,color:"#8E8E9A",marginTop:6}}>{lastBackup?"Último backup: "+new Date(lastBackup).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"Nenhum backup baixado neste aparelho ainda."}</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:14,paddingTop:12,borderTop:"1px solid #F3F3F3"}}>
                <span style={{fontSize:12,color:"#8E8E9A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginRight:8}}>{user&&user.email}</span>
                <button onClick={onLogout} style={{background:"transparent",border:"1px solid #E8E8E8",borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:700,color:"#4a4a6a",cursor:"pointer",flexShrink:0}}>Sair</button>
              </div>
            </div>
          </div>
        )}

        {/* ══ DASHBOARD ══ */}
        {tab==="dash"&&(
          <div style={{animation:"fadeIn 0.2s ease"}}>
            <div style={{fontSize:12,color:"#8E8E9A",fontWeight:600,marginBottom:14,letterSpacing:1,textTransform:"uppercase"}}>{MONTHS[month]} {year}</div>

            {/* Saldo */}
            <div style={{background:bal>=0?"#00A86B":"#E8544A",borderRadius:20,padding:"20px 20px",marginBottom:14,boxShadow:bal>=0?"0 6px 20px rgba(0,168,107,0.25)":"0 6px 20px rgba(232,84,74,0.25)"}}>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.7)",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Saldo do Mês</div>
              <div style={{fontSize:34,fontWeight:900,color:"#fff",letterSpacing:-1}}>{fmt(bal)}</div>
              <div style={{display:"flex",gap:20,marginTop:10,fontSize:12,color:"rgba(255,255,255,0.85)",fontWeight:600}}>
                <span>↑ {fmt(totInc)}</span>
                <span>↓ {fmt(totDebit)}</span>
              </div>
            </div>

            {/* A vencer */}
            {totPending>0&&(
              <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:14,boxShadow:shadow,border:"1px solid #E0D5FF"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:11,color:"#6C5CE7",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase"}}>💳 A vencer em {MONTHS[month===11?0:month+1]}</div>
                    <div style={{fontSize:22,fontWeight:800,color:"#6C5CE7",marginTop:3}}>{fmt(totPending)}</div>
                  </div>
                  <div style={{fontSize:11,color:"#8E8E9A",textAlign:"right",lineHeight:1.6}}>
                    <div>Faturas em aberto</div>

                  </div>
                </div>

                  if(!tot) return null;
                  return (
                    <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderTop:"1px solid #F0EBFF",fontSize:13}}>
                      <span style={{color:"#8E8E9A",fontWeight:500}}>{p.l} <span style={{fontSize:11}}>· vence dia {p.dueDay}</span></span>
                      <span style={{color:"#6C5CE7",fontWeight:700}}>{fmt(tot)}</span>
                    </div>

                })}

                  const inc=pInc(p.id), deb=pDebit(p.id), b=inc-deb;
                  return (
                    <div key={p.id} style={{background:"#fff",borderRadius:14,padding:"13px 16px",boxShadow:shadow,border:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div style={{width:8,height:8,borderRadius:"50%",background:p.color}}/>

                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:16,fontWeight:800,color:b>=0?"#00A86B":"#E8544A"}}>{fmt(b)}</div>

                    </div>

                    <Bar value={t.total} max={maxType} color={t.c}/>

                <div style={{fontSize:10,color:"#00A86B",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:5}}>Corrente</div>
                <div style={{fontSize:17,fontWeight:800,color:"#1a1a2e"}}>{fmt(debitExp.filter(e=>!e.isCard).reduce((s,e)=>s+e.amount,0))}</div>
                <div style={{fontSize:11,color:"#8E8E9A",marginTop:3}}>Débitos diretos</div>
              </div>
              <div style={{background:"#fff",borderRadius:14,padding:"13px 14px",boxShadow:shadow,border:"1px solid #EBEBEB"}}>
                <div style={{fontSize:10,color:"#6C5CE7",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:5}}>Faturas</div>
                <div style={{fontSize:17,fontWeight:800,color:"#1a1a2e"}}>{fmt(debitExp.filter(e=>e.isCard).reduce((s,e)=>s+e.amount,0))}</div>
                <div style={{fontSize:11,color:"#8E8E9A",marginTop:3}}>Faturas debitadas no mês</div>
              </div>
            </div>

            {/* Categorias */}
            <div style={{background:"#fff",borderRadius:16,padding:16,boxShadow:shadow,border:"1px solid #EBEBEB"}}>
              <div style={{fontSize:11,color:"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>Gastos por categoria</div>
              {byCat.length===0&&<div style={{color:"#8E8E9A",textAlign:"center",padding:"16px 0",fontSize:13}}>Sem débitos neste mês</div>}
              {byCat.map(c=>(
                <div key={c.id} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:13,fontWeight:600,color:"#1a1a2e"}}>{c.e} {c.l}</span>
                    <span style={{fontSize:13,fontWeight:700,color:c.c}}>{fmt(c.total)}</span>
                  </div>
                  <Bar value={c.total} max={maxCat} color={c.c}/>
                  <div style={{fontSize:11,color:"#8E8E9A",marginTop:3}}>{totMExp>0?((c.total/totMExp)*100).toFixed(1):0}% dos gastos</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ══ LISTA ══ */}
        {tab==="list"&&(
          <div style={{animation:"fadeIn 0.2s ease"}}>
            <div style={{background:"#fff",borderRadius:14,padding:4,marginBottom:16,boxShadow:shadow,border:"1px solid #EBEBEB",display:"grid",gridTemplateColumns:"1fr 1fr"}}>
              {[["expense","↓ Gastos"],["income","↑ Entradas"]].map(([m,l])=>(
                <button key={m} onClick={()=>setMode(m)} style={{background:mode===m?"#1a1a2e":"transparent",border:"none",borderRadius:11,padding:"10px",color:mode===m?"#fff":"#8E8E9A",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all 0.2s"}}>{l}</button>
              ))}
            </div>

            {mode==="expense"&&(
              <>
                <div style={{background:"#F5F0FF",borderRadius:12,padding:"9px 14px",marginBottom:12,fontSize:12,color:"#6C5CE7",fontWeight:500}}>
                  {fPmIsCard ? `Fatura de ${MONTHS[month]} — compras que debitam em ${MONTHS[month]}` : `Gastos lançados em ${MONTHS[month]} — cartões debitam em ${MONTHS[month===11?0:month+1]}`}
                </div>
                <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                  <select value={fPer} onChange={e=>setFPer(e.target.value)} style={SS}><option value="all">Todos</option>{PERSONS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
                  <select value={fCat} onChange={e=>setFCat(e.target.value)} style={SS}><option value="all">Categoria</option>{CATS.map(c=><option key={c.id} value={c.id}>{c.l}</option>)}</select>
                  <select value={fPm}  onChange={e=>setFPm(e.target.value)}  style={SS}><option value="all">Pagamento</option>{PMS.map(p=><option key={p.id} value={p.id}>{p.l}</option>)}</select>
                </div>
                <div style={{fontSize:12,color:"#8E8E9A",marginBottom:10,fontWeight:500}}>{fExp.length} lançamentos — {fmt(fExp.reduce((s,e)=>s+e.amount,0))}</div>
                {fExp.length===0&&<div style={{color:"#8E8E9A",textAlign:"center",padding:"40px 0",fontSize:14}}>Nenhum gasto encontrado</div>}
                {fExp.map(e=>{
                  const cat=CATS.find(c=>c.id===e.cat);
                  const pm=PMS.find(p=>p.id===e.pm);
                  const per=PERSONS.find(p=>p.id===e.person);
                  return (
                    <div key={e.id} style={{background:"#fff",borderRadius:14,padding:"13px 14px",marginBottom:8,boxShadow:shadow,border:"1px solid #EBEBEB",display:"flex",alignItems:"flex-start",gap:12,animation:"fadeIn 0.2s ease"}}>
                      <div style={{width:42,height:42,borderRadius:12,background:(cat?.c||"#94A3B8")+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{cat?.e||"📦"}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",gap:5,marginBottom:5,flexWrap:"wrap"}}>
                          <span style={{fontSize:11,background:per?.color+"15",color:per?.color,borderRadius:20,padding:"2px 9px",fontWeight:700}}>{per?.name}</span>
                          {e.isCard&&<span style={{fontSize:11,background:"#F5F0FF",color:"#6C5CE7",borderRadius:20,padding:"2px 9px",fontWeight:600}}>💳 Débito em {e.billMonth!=null?MONTHS[e.billMonth]:""}</span>}
                        </div>
                        <div style={{fontSize:14,fontWeight:700,color:"#1a1a2e",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.desc}</div>
                        <div style={{fontSize:12,color:"#8E8E9A",marginTop:3}}>{cat?.l} · {pm?.l} · {(e.date||"").split("-").reverse().join("/")}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
                        <span style={{fontSize:15,fontWeight:800,color:e.isCard?"#6C5CE7":cat?.c||"#1a1a2e"}}>{fmt(e.amount)}</span>
                        <div style={{display:"flex",gap:8}}>
                          <button onClick={()=>setEditExp(e)} style={{background:"transparent",border:"none",color:"#B0B0C0",fontSize:15,cursor:"pointer",padding:0,lineHeight:1}}>✏️</button>
                          <button onClick={()=>setConfirmDel({msg:e.desc+" — "+fmt(e.amount),onConfirm:()=>delExp(e.id)})} style={{background:"transparent",border:"none",color:"#D1D1D1",fontSize:17,cursor:"pointer",padding:0,lineHeight:1}}>🗑️</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </>
            )}

            {mode==="income"&&(
              <>
                <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                  <select value={fPer}  onChange={e=>setFPer(e.target.value)}  style={SS}><option value="all">Todos</option>{PERSONS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
                  <select value={fType} onChange={e=>setFType(e.target.value)} style={SS}><option value="all">Tipo</option>{ITYPES.map(t=><option key={t.id} value={t.id}>{t.l}</option>)}</select>
                </div>
                <div style={{fontSize:12,color:"#8E8E9A",marginBottom:10,fontWeight:500}}>{fInc.length} entradas — {fmt(fInc.reduce((s,i)=>s+i.amount,0))}</div>
                {fInc.length===0&&<div style={{color:"#8E8E9A",textAlign:"center",padding:"40px 0",fontSize:14}}>Nenhuma entrada encontrada</div>}
                {fInc.map(i=>{
                  const tp=ITYPES.find(t=>t.id===i.type);
                  const per=PERSONS.find(p=>p.id===i.person);
                  return (
                    <div key={i.id} style={{background:"#fff",borderRadius:14,padding:"13px 14px",marginBottom:8,boxShadow:shadow,border:"1px solid #EBEBEB",display:"flex",alignItems:"center",gap:12,animation:"fadeIn 0.2s ease"}}>
                      <div style={{width:42,height:42,borderRadius:12,background:(tp?.c||"#00A86B")+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{tp?.e||"💰"}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{marginBottom:5}}><span style={{fontSize:11,background:per?.color+"15",color:per?.color,borderRadius:20,padding:"2px 9px",fontWeight:700}}>{per?.name}</span></div>
                        <div style={{fontSize:14,fontWeight:700,color:"#1a1a2e",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{i.desc}</div>
                        <div style={{fontSize:12,color:"#8E8E9A",marginTop:3}}>{tp?.l} · {(i.date||"").split("-").reverse().join("/")}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                        <span style={{fontSize:15,fontWeight:800,color:"#00A86B"}}>+{fmt(i.amount)}</span>
                        <div style={{display:"flex",gap:8}}>
                          <button onClick={()=>setEditInc(i)} style={{background:"transparent",border:"none",color:"#B0B0C0",fontSize:15,cursor:"pointer",padding:0}}>✏️</button>
                          <button onClick={()=>setConfirmDel({msg:i.desc+" — "+fmt(i.amount),onConfirm:()=>delInc(i.id)})} style={{background:"transparent",border:"none",color:"#D1D1D1",fontSize:17,cursor:"pointer",padding:0}}>🗑️</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}

        {/* ══ COMPARATIVO ══ */}
        {tab==="cmp"&&(
          <div style={{animation:"fadeIn 0.2s ease"}}>
            <div style={{fontSize:12,color:"#8E8E9A",fontWeight:600,marginBottom:14,letterSpacing:1,textTransform:"uppercase"}}>Comparativo Mensal</div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
              {[{lbl:MONTHS[prevM],inc:prevI,exp:prevT},{lbl:MONTHS[month],inc:totInc,exp:totDebit}].map((col,idx)=>{
                const b=col.inc-col.exp;
                return (
                  <div key={idx} style={{background:idx===1?"#1a1a2e":"#fff",borderRadius:16,padding:"15px",boxShadow:idx===1?shadowMd:shadow,border:idx===1?"none":"1px solid #EBEBEB"}}>
                    <div style={{fontSize:11,color:idx===1?"rgba(255,255,255,0.5)":"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>{col.lbl}</div>
                    <div style={{fontSize:18,fontWeight:800,color:b>=0?"#00A86B":"#E8544A"}}>{fmt(b)}</div>
                    <div style={{fontSize:11,color:idx===1?"rgba(255,255,255,0.5)":"#8E8E9A",marginTop:6,lineHeight:1.7}}>
                      <div>↑ {fmt(col.inc)}</div>
                      <div>↓ {fmt(col.exp)}</div>
                    </div>
                  </div>
                );
              })}
            </div>

            {diffP&&(
              <div style={{background:"#fff",borderRadius:14,padding:"13px 16px",marginBottom:16,boxShadow:shadow,border:"1px solid #EBEBEB",display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:44,height:44,borderRadius:12,background:diff>0?"#FFF0EF":"#F0FFF8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{diff>0?"📈":"📉"}</div>
                <div>
                  <div style={{fontWeight:700,color:diff>0?"#E8544A":"#00A86B",fontSize:14}}>{diff>0?"Gastou "+fmt(Math.abs(diff))+" a mais":"Economizou "+fmt(Math.abs(diff))}</div>
                  <div style={{fontSize:12,color:"#8E8E9A",marginTop:2}}>vs. {MONTHS[prevM]} ({diff>0?"+":"-"}{Math.abs(diffP)}%)</div>
                </div>
              </div>
            )}

            <div style={{background:"#fff",borderRadius:16,padding:16,boxShadow:shadow,border:"1px solid #EBEBEB"}}>
              <div style={{fontSize:11,color:"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:14}}>Por categoria</div>
              {CATS.map(c=>{
                const curr=byCat.find(b=>b.id===c.id)?.total||0;
                const prev=prevBC[c.id]||0;
                if(curr===0&&prev===0) return null;
                const cd=curr-prev, mb=Math.max(curr,prev,1);
                return (
                  <div key={c.id} style={{marginBottom:16}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                      <span style={{fontSize:13,fontWeight:600,color:"#1a1a2e"}}>{c.e} {c.l}</span>
                      <span style={{fontSize:12,fontWeight:700,color:cd>0?"#E8544A":"#00A86B"}}>{cd>0?"+":""}{fmt(cd)}</span>
                    </div>
                    {[{lbl:MONTHS[prevM],val:prev,col:"#D1D1D1"},{lbl:MONTHS[month],val:curr,col:c.c}].map(row=>(
                      <div key={row.lbl} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                        <span style={{fontSize:10,color:"#8E8E9A",width:28,flexShrink:0}}>{row.lbl}</span>
                        <div style={{flex:1,background:"#F5F5F3",borderRadius:99,height:7,overflow:"hidden"}}>
                          <div style={{background:row.col,height:"100%",width:((row.val/mb)*100)+"%",borderRadius:99,transition:"width 0.4s ease"}}/>
                        </div>
                        <span style={{fontSize:11,color:row.col,width:70,textAlign:"right",fontWeight:600,flexShrink:0}}>{fmt(row.val)}</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ══ INVEST ══ */}
        {tab==="inv"&&(
          <div style={{animation:"fadeIn 0.2s ease"}}>
            <div style={{fontSize:12,color:"#8E8E9A",fontWeight:600,marginBottom:14,letterSpacing:1,textTransform:"uppercase"}}>Investimentos</div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
              <div style={{background:"#1a1a2e",borderRadius:16,padding:"15px",boxShadow:shadowMd}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>Patrimônio</div>
                <div style={{fontSize:20,fontWeight:800,color:"#F59E0B"}}>{fmt(totInv)}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:3}}>{accounts.length} contas</div>
              </div>
              <div style={{background:"#fff",borderRadius:16,padding:"15px",boxShadow:shadow,border:"1px solid #EBEBEB"}}>
                <div style={{fontSize:10,color:"#00A86B",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>Aportado</div>
                <div style={{fontSize:20,fontWeight:800,color:"#1a1a2e"}}>{fmt(totContr)}</div>
                <div style={{fontSize:11,color:"#8E8E9A",marginTop:3}}>{contribs.length} aportes</div>
              </div>
            </div>

            {/* Contas */}
            <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:14,boxShadow:shadow,border:"1px solid #EBEBEB"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontSize:11,color:"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase"}}>Contas</div>
                <button onClick={()=>setShowAcc(v=>!v)} style={{background:"#F5F0FF",border:"none",borderRadius:20,color:"#6C5CE7",fontSize:12,fontWeight:700,cursor:"pointer",padding:"5px 14px"}}>+ Nova conta</button>
              </div>

              {showAcc&&(
                <div style={{background:"#F9F9F9",borderRadius:12,padding:14,marginBottom:14,border:"1px solid #EBEBEB",display:"flex",flexDirection:"column",gap:10}}>
                  <input placeholder="Nome (ex: Tesouro Selic)" value={newA.name} onChange={e=>setNewA(f=>({...f,name:e.target.value}))} style={IS}/>
                  <input placeholder="Instituição (ex: XP)" value={newA.inst} onChange={e=>setNewA(f=>({...f,inst:e.target.value}))} style={IS}/>
                  <input placeholder="Saldo atual" type="number" value={newA.bal} onChange={e=>setNewA(f=>({...f,bal:e.target.value}))} style={IS}/>
                  <button onClick={addAcc} style={{background:"#F59E0B",border:"none",borderRadius:12,padding:12,color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>Adicionar conta</button>
                </div>
              )}

              {accounts.map(a=>{
                const pct=totInv>0?((a.balance/totInv)*100).toFixed(1):0;
                const ac=contribs.filter(c=>c.accId===a.id).reduce((s,c)=>s+c.amount,0);
                return (
                  <div key={a.id} style={{borderBottom:"1px solid #F5F5F5",paddingBottom:14,marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div style={{width:10,height:10,borderRadius:"50%",background:a.color,flexShrink:0}}/>
                        <div>
                          <div style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>{a.name}</div>
                          <div style={{fontSize:12,color:"#8E8E9A",marginTop:1}}>{a.inst}</div>
                        </div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:16,fontWeight:800,color:a.color}}>{fmt(a.balance)}</div>
                        <div style={{fontSize:11,color:"#8E8E9A",marginTop:1}}>{pct}% do portfólio</div>
                        <button onClick={()=>delAcc(a.id)} style={{background:"transparent",border:"none",color:"#D1D1D1",fontSize:13,cursor:"pointer",marginTop:4}}>✕ Remover</button>
                      </div>
                    </div>
                    <div style={{background:"#F5F5F3",borderRadius:99,height:6,overflow:"hidden"}}>
                      <div style={{background:a.color,height:"100%",width:pct+"%",borderRadius:99,transition:"width 0.4s"}}/>
                    </div>
                    <div style={{fontSize:11,color:"#8E8E9A",marginTop:5}}>Total aportado: <span style={{color:a.color,fontWeight:700}}>{fmt(ac)}</span></div>
                  </div>
                );
              })}
              {accounts.length===0&&<div style={{color:"#8E8E9A",textAlign:"center",padding:"20px 0",fontSize:13}}>Nenhuma conta cadastrada ainda</div>}
            </div>

            {/* Registrar aporte */}
            <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:14,boxShadow:shadow,border:"1px solid #EBEBEB"}}>
              <div style={{fontSize:11,color:"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>Registrar aporte</div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <select value={invF.accId} onChange={e=>setInvF(f=>({...f,accId:e.target.value}))} style={{...IS,padding:"13px 14px"}}>
                  <option value="">Selecione a conta...</option>
                  {accounts.map(a=><option key={a.id} value={a.id}>{a.name} — {a.inst}</option>)}
                </select>
                <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:10}}>
                  <input placeholder="Valor" type="number" value={invF.amt} onChange={e=>setInvF(f=>({...f,amt:e.target.value}))} style={IS}/>
                  <select value={invF.month} onChange={e=>setInvF(f=>({...f,month:e.target.value}))} style={{...SS,padding:"13px 12px"}}>
                    {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
                  </select>
                </div>
                <button onClick={addContr} style={{background:"#00A86B",border:"none",borderRadius:12,padding:13,color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 12px rgba(0,168,107,0.3)"}}>Registrar Aporte</button>
              </div>
            </div>

            {/* Histórico de aportes */}
            {cByM.length>0&&(
              <div style={{background:"#fff",borderRadius:16,padding:16,boxShadow:shadow,border:"1px solid #EBEBEB"}}>
                <div style={{fontSize:11,color:"#8E8E9A",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>Aportes por mês</div>
                {cByM.map((c,i)=>(
                  <div key={i} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:13,fontWeight:600,color:"#1a1a2e"}}>{c.label}</span>
                      <span style={{fontSize:13,fontWeight:700,color:"#00A86B"}}>{fmt(c.total)}</span>
                    </div>
                    <Bar value={c.total} max={maxC} color="#00A86B"/>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

function LoadingScreen({text}) {
  return (
    <div style={{minHeight:"100vh",background:"#F5F5F3",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
      <div style={{fontSize:52}}>💰</div>
      <div style={{fontSize:24,fontWeight:800,color:"#1a1a2e",letterSpacing:-0.5}}>Prosperidade</div>
      <div style={{width:32,height:32,border:"3px solid #E8E8E8",borderTop:"3px solid #6C5CE7",borderRadius:"50%",animation:"spin 0.8s linear infinite",marginTop:8}}/>
      <div style={{color:"#8E8E9A",fontSize:13}}>{text}</div>
    </div>
  );
}

function LoginScreen({onLogin, onReset, error, info, busy}) {
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  return (
    <div style={{minHeight:"100vh",background:"#F5F5F3",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:360,background:"#fff",borderRadius:20,padding:24,boxShadow:shadowMd,border:"1px solid #EBEBEB"}}>
        <div style={{textAlign:"center",marginBottom:18}}>
          <div style={{fontSize:44}}>💰</div>
          <div style={{fontSize:22,fontWeight:800,color:"#1a1a2e",letterSpacing:-0.5}}>Prosperidade</div>
          <div style={{fontSize:12,color:"#8E8E9A",marginTop:4}}>Entre para ver as finanças da família</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input type="email" autoComplete="username" placeholder="E-mail" value={email} onChange={e=>setEmail(e.target.value)} style={IS}/>
          <input type="password" autoComplete="current-password" placeholder="Senha" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") onLogin(email,pw); }} style={IS}/>
          {error&&<div style={{background:"#FFF0EF",color:"#E8544A",borderRadius:10,padding:"9px 12px",fontSize:12,fontWeight:600}}>{error}</div>}
          {info&&<div style={{background:"#E8F8F0",color:"#00A86B",borderRadius:10,padding:"9px 12px",fontSize:12,fontWeight:600}}>{info}</div>}
          <button onClick={()=>onLogin(email,pw)} disabled={busy||!email||!pw} style={{background:"#6C5CE7",border:"none",borderRadius:14,padding:"14px",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",opacity:(busy||!email||!pw)?0.6:1}}>{busy?"Entrando...":"Entrar"}</button>
          <button onClick={()=>onReset(email)} style={{background:"transparent",border:"none",color:"#6C5CE7",fontSize:12,cursor:"pointer",fontWeight:600}}>Esqueci a senha</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [user,setUser]=useState(undefined); // undefined = verificando, null = deslogado
  const [authErr,setAuthErr]=useState("");
  const [authInfo,setAuthInfo]=useState("");
  const [busy,setBusy]=useState(false);

  useEffect(()=>auth.onAuthStateChanged(u=>{
    if(u && ALLOWED_EMAILS.length>0 && !ALLOWED_EMAILS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase())){
      setAuthErr("Este e-mail não tem acesso ao app.");
      auth.signOut();
      setUser(null);
      return;
    }
    setUser(u||null);
  }),[]);

  const authMsg = e => {
    const c = e && e.code;
    if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-email") return "E-mail ou senha incorretos.";
    if(c==="auth/too-many-requests") return "Muitas tentativas. Aguarde alguns minutos e tente de novo.";
    if(c==="auth/network-request-failed") return "Sem conexão. Verifique sua internet.";
    return "Não consegui entrar ("+(c||"erro desconhecido")+").";
  };
  const login = async (email,pw) => {
    setBusy(true); setAuthErr(""); setAuthInfo("");
    try{ await auth.signInWithEmailAndPassword(email.trim(),pw); }
    catch(e){ setAuthErr(authMsg(e)); }
    setBusy(false);
  };
  const reset = async email => {
    setAuthErr(""); setAuthInfo("");
    if(!email.trim()){ setAuthErr("Digite seu e-mail primeiro."); return; }
    try{ await auth.sendPasswordResetEmail(email.trim()); setAuthInfo("Se esse e-mail tem conta, enviei um link para redefinir a senha."); }
    catch(e){ setAuthErr(authMsg(e)); }
  };

  if(user===undefined) return <LoadingScreen text="Verificando acesso..."/>;
  if(!user) return <LoginScreen onLogin={login} onReset={reset} error={authErr} info={authInfo} busy={busy}/>;
  return <MainApp user={user} onLogout={()=>auth.signOut()}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
