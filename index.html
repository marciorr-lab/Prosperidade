// Descrições da conta corrente que indicam pagamento de fatura de cartão (ignoradas na importação para não contar em dobro).
const CARD_PAYMENT_RE = /(pag(amento|to)?|pgto|debito)\s+(de\s+|do\s+|da\s+)?(fatura|cartao)|fatura\s+(do\s+)?cartao|cartao\s+de\s+credito|(fatura|pag\w*)[^\n]*\b(visa|mastercard|master)\b/;

// Mês (0-11) e ano em que a compra será debitada, dado o dia de fechamento do cartão.
// Compra até o dia de fechamento -> debita no mês seguinte; depois do fechamento -> daqui a 2 meses.
function billingMonth(dateStr, closeDay = 31) {
  const d = new Date(dateStr + "T12:00:00");
  let m = d.getMonth() + 1 + (d.getDate() > closeDay ? 1 : 0);
  let y = d.getFullYear();
  while (m > 11) { m -= 12; y++; }
  return { month:m, year:y };
}
function todayLocal() {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

];
// Quanto a movimentação soma (ou tira) do saldo da conta.
function movDelta(m) { return (m.type||"aporte")==="retirada" ? -m.amount : m.amount; }
function closeDayOf(pmId) { return PMS.find(p=>p.id===pmId)?.closeDay ?? 31; }
function billingFor(dateStr, pmId) { return billingMonth(dateStr, closeDayOf(pmId)); }

// Converte "1.234,56", "1234.56", "R$ 1.234,56" etc. em número (sempre positivo).
function parseAmount(v) {
  let s = String(v ?? "").trim();
  if (!s) return 0;
  s = s.replace(/[^0-9.,]/g, "");
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) {
    s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if (lc > -1) {
    s = (s.match(/,/g) || []).length === 1 ? s.replace(",", ".") : s.replace(/,/g, "");
  } else if (ld > -1) {
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : Math.abs(n);
}

// Aceita AAAA-MM-DD, DD/MM/AAAA e DD/MM/AA.
function parseDateStr(raw) {
  const t = String(raw ?? "").trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1]+"-"+m[2]+"-"+m[3];
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    const y = m[3].length === 2 ? "20"+m[3] : m[3];
    return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  }
  return t;
}

// Chave para detectar lançamento já importado.
function dupKey(r) {
  return [
    r.date,
    String(r.desc || "").trim().toLowerCase().replace(/\s+/g, " "),
    Number(r.amount).toFixed(2),
    r.kind === "entrada" ? "entrada" : (r.pm || "corrente")
  ].join("|");
}

function normalizeDesc(s) {
  return (s||"")
    .toString()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[0-9]/g,"")
    .replace(/[^a-z\s]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

// Gráfico de linhas simples (SVG). series: [{values:[número|null], color}]
function LineChart({labels, series, zero, label}) {
  const all = series.flatMap(s=>s.values.filter(v=>v!=null));
  if(all.length===0) return null;
  const L=44, R=336, T=30, B=160;
  const lo = zero ? Math.min(0,...all) : Math.min(...all);
  const hi = Math.max(...all);
  const span = (hi-lo) || Math.abs(hi) || 1;
  const raw = span/3, pw = Math.pow(10,Math.floor(Math.log10(raw))), f = raw/pw;
  const step = (f<=1?1:f<=2?2:f<=5?5:10)*pw;
  let tmin = Math.floor(lo/step)*step, tmax = Math.ceil(hi/step)*step;
  if(tmax===tmin) tmax = tmin+step;
  const ticks=[]; for(let v=tmin; v<=tmax+step/1000 && ticks.length<7; v+=step) ticks.push(v);
  const n = labels.length;
  const X = i => n===1 ? (L+R)/2 : L + i*(R-L)/(n-1);
  const Y = v => B - (v-tmin)/(tmax-tmin)*(B-T);
  const fmtTick = v => Math.abs(v)>=1000 ? (v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"k" : String(Math.round(v));
  const every = n>7 ? 2 : 1;
  return (
    <svg width="100%" viewBox="0 0 354 196" role="img" aria-label={label||"Gráfico de linhas"}>
      <g stroke="#ECE9FF" strokeWidth="1">{ticks.map((v,i)=><line key={i} x1={L} y1={Y(v)} x2={350} y2={Y(v)}/>)}</g>
      <g fontSize="11" fill="#5A5680" fontWeight="600" style={{fontFamily:"inherit"}}>
        {ticks.map((v,i)=><text key={i} x="0" y={Y(v)+4}>{fmtTick(v)}</text>)}
        {labels.map((l,i)=> i%every===0 ? <text key={i} x={X(i)} y="184" textAnchor="middle">{l}</text> : null)}
      </g>
      {series.map((s,si)=>{
        const segs=[]; let cur=[];
        s.values.forEach((v,i)=>{ if(v==null){ if(cur.length) segs.push(cur); cur=[]; } else cur.push(X(i)+","+Y(v)); });
        if(cur.length) segs.push(cur);
        return <g key={si}>
          {segs.map((p,k)=>p.length>1&&<polyline key={k} points={p.join(" ")} fill="none" stroke={s.color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>)}
          {s.values.map((v,i)=>v==null?null:<circle key={i} cx={X(i)} cy={Y(v)} r="4" fill="#fff" stroke={s.color} strokeWidth="3"/>)}
        </g>;
      })}
    </svg>
  );
}

// Parcelas: acha "parcela N/M" na descrição, agrupa pela mesma compra e projeta as que faltam.
function computeInstallments(expenses, sel) {
  const re = /parcela\s*(\d+)\s*\/\s*(\d+)/i;
  const G = {};
  expenses.forEach(e=>{
    const mt = re.exec(e.desc||""); if(!mt) return;
    const n = parseInt(mt[1],10), tot = parseInt(mt[2],10);
    if(!(tot>0) || n<1 || n>tot) return;
    const bm = e.isCard ? e.billMonth : e.month, by = e.isCard ? e.billYear : e.year;
    if(bm==null || by==null) return;
    const name = (e.desc||"").replace(re,"").replace(/[\s\-–:]+$/,"").trim() || e.desc;
    const key = normalizeDesc(name)+"|"+e.pm+"|"+tot;
    const g = G[key] || (G[key]={name, pm:e.pm, tot, items:[]});
    g.items.push({n, k:mkey(bm,by), amount:e.amount});
  });
  const groups=[], finished=[], commit={}; let left=0;
  Object.values(G).forEach(g=>{
    g.items.sort((a,b)=>a.n-b.n || a.k-b.k);
    const first=g.items[0], last=g.items[g.items.length-1];
    const sched={};
    g.items.forEach(it=>{ sched[it.k]=it.amount; });
    for(let j=1;j<=g.tot-last.n;j++){ if(sched[last.k+j]===undefined) sched[last.k+j]=last.amount; }
    const keys = Object.keys(sched).map(Number).sort((a,b)=>a-b);
    const endK = keys[keys.length-1];
    let nAt;
    if(sel>=last.k) nAt = Math.min(g.tot, last.n + (sel-last.k));
    else { const done=g.items.filter(it=>it.k<=sel); nAt = done.length ? done[done.length-1].n : first.n-1; }
    const fut = keys.filter(k=>k>sel);
    if(fut.length>0){
      fut.forEach(k=>{ commit[k]=(commit[k]||0)+sched[k]; left+=sched[k]; });
      groups.push({name:g.name, pm:g.pm, tot:g.tot, n:nAt, monthly:(sched[sel]!==undefined?sched[sel]:sched[fut[0]]), endK, remaining:g.tot-nAt});
    } else if(endK===sel || endK===sel-1){
      finished.push({name:g.name, tot:g.tot, endK});
    }
  });
  groups.sort((a,b)=>a.endK-b.endK || a.name.localeCompare(b.name));
  return {groups, finished, commit, left};
}

  const rowStatus = useMemo(()=>{
    const seen={}, usedManual={};
    const T = ds => new Date(ds+"T12:00:00").getTime();
    return reviewRows.map(r=>{
      const k=dupKey(r); const n=seen[k]||0; seen[k]=n+1;

      const isC = PMS.find(p=>p.id===r.pm)?.isCard;
      const payment = r.kind==="gasto" && !isC && CARD_PAYMENT_RE.test(r.norm||"");

      // Parece um lançamento manual? Mesmo valor, mesma forma de pagamento (gastos) e data a até 3 dias.
      let manual = null;
      if(!dup && !payment && !invalid){
        const pool = r.kind==="entrada" ? manualInc : manualExp;
        let best=null, bestD=Infinity;
        pool.forEach(m=>{
          if(usedManual[m.id]) return;
          if(r.kind!=="entrada" && m.pm!==r.pm) return;
          if(Math.abs(m.amount-r.amount)>=0.005) return;
          const dd=Math.abs(T(m.date)-T(r.date))/86400000;
          if(dd<=3 && dd<bestD){ best=m; bestD=dd; }
        });
        if(best){ usedManual[best.id]=1; manual={id:best.id, coll:r.kind==="entrada"?"incomes":"expenses", desc:best.desc, date:best.date}; }

  const diff      = totDebit-prevT;

  // ── IMPORTAÇÃO EM MASSA ──
  const buildRows = rawRows => {
    return rawRows
      .filter(r => r && (r.data || r.Data) && (r.descricao || r.Descricao || r.Descrição))
      .map((r,i) => {
        const get = (...keys)=>{ for(const k of keys){ if(r[k]!==undefined && r[k]!==null && r[k]!=="") return r[k]; } return ""; };
        const date     = parseDateStr(get("data","Data"));
        const desc     = String(get("descricao","Descricao","Descrição")).trim();
        const amount   = parseAmount(get("valor","Valor"));
        const kindRaw  = String(get("tipo","Tipo")).toLowerCase().trim();
        const kind     = kindRaw==="entrada" ? "entrada" : "gasto";
        const origem   = String(get("origem","Origem")).trim() || "corrente";
        const pmObj    = PMS.find(p=>p.id===origem) || PMS[0];
        const norm     = normalizeDesc(desc);
        const rule     = catRules.find(cr=>cr.norm===norm);
        const invalid  = !/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(new Date(date+"T12:00:00").getTime()) || !(amount>0);
        const isInstallment = /parcela\s*\d+\s*\/\s*\d+/i.test(desc);

        // Mês da fatura: o valor explícito do CSV (coluna "fatura", AAAA-MM) sempre vence.
        // Sem ele, calcula pelo dia de fechamento do cartão (billSource="auto") — o app avisa na revisão.
        let billMonth = null, billYear = null, billSource = null;
        if(pmObj.isCard && !invalid){
          const faturaRaw = String(get("fatura","Fatura")).trim();
          if(/^\d{4}-\d{2}$/.test(faturaRaw)){
            const [fy,fm] = faturaRaw.split("-");
            billYear = parseInt(fy,10); billMonth = parseInt(fm,10)-1; billSource = "csv";
          } else {
            const b = billingFor(date, pmObj.id);
            billMonth = b.month; billYear = b.year; billSource = "auto";
          }
        }

        return {
          _tmpId: "row_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
          date, desc, norm, amount, kind, invalid, isInstallment,
          pm: pmObj.id,
          billMonth, billYear, billSource,
          cat: (rule && rule.kind==="gasto") ? rule.cat : "outros",
          person: rule ? (rule.person||"p1") : "p1",
          incType: (rule && rule.kind==="entrada") ? (rule.incType||"salario") : "salario",
          matched: !!rule
        };
      });
  };

  // Carrega as linhas na revisão e sugere a fatura mais comum do arquivo para o seletor de lote.
  const loadRows = rows => {
    setReviewRows(rows);

    rows.forEach(r=>{ if(r.billMonth!=null&&r.billYear!=null){ const k=r.billYear+"-"+r.billMonth; cnt[k]=(cnt[k]||0)+1; } });
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top){ const [y,m]=top[0].split("-").map(Number); setBulkBill({month:m,year:y}); }
  };

  const handleFile = e => {
    const file = e.target.files[0];
    if(!file) return;
    setImportErr("");
    const ext = file.name.split(".").pop().toLowerCase();
    if(ext==="csv"){
      Papa.parse(file, {
        header:true, skipEmptyLines:true,
        complete: res => {
          if(!res.data || res.data.length===0){ setImportErr("Não encontrei linhas válidas no arquivo."); return; }
          loadRows(buildRows(res.data));
        },
        error: () => setImportErr("Não consegui ler esse CSV. Confira o formato.")
      });
    } else if(ext==="xlsx" || ext==="xls"){
      const reader = new FileReader();
      reader.onload = evt => {
        try{
          const wb = XLSX.read(evt.target.result, {type:"binary"});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet, {raw:false});
          if(!json || json.length===0){ setImportErr("Não encontrei linhas válidas na planilha."); return; }
          loadRows(buildRows(json));
        }catch(err){ setImportErr("Não consegui ler essa planilha. Confira o formato."); }
      };
      reader.readAsBinaryString(file);
    } else {
      setImportErr("Formato não suportado. Envie um arquivo .csv ou .xlsx.");
    }
    e.target.value = "";
  };

  const updateRow = (idx, patch) => setReviewRows(rows => rows.map((r,i)=> i===idx ? {...r,...patch} : r));

      rows.forEach(row=>{

        if(row.kind==="gasto"){
          const ref = db.collection("expenses").doc();
          const isCard = PMS.find(p=>p.id===row.pm)?.isCard||false;
          let billMonth = row.billMonth, billYear = row.billYear;
          if(isCard && (billMonth==null || billYear==null)){
            const b = billingFor(row.date, row.pm); billMonth=b.month; billYear=b.year;
          }
          ops.push({ref, data:{
            date:row.date, month:d.getMonth(), year:d.getFullYear(),
            desc:row.desc, cat:row.cat, pm:row.pm, person:row.person,
            amount: parseFloat(row.amount.toFixed(2)),
            isCard, billMonth:isCard?billMonth:null, billYear:isCard?billYear:null,
            createdAt:new Date().toISOString(), importedFrom:"import", importBatchId:batchId
          }});
        } else {
          const ref = db.collection("incomes").doc();
          ops.push({ref, data:{
            date:row.date, month:d.getMonth(), year:d.getFullYear(),
            desc:row.desc, type:row.incType, person:row.person,
            amount: parseFloat(row.amount.toFixed(2)),
            createdAt:new Date().toISOString(), importedFrom:"import", importBatchId:batchId
          }});
        }
        if(row.norm){
          rulesToSave[row.norm] = {norm:row.norm, kind:row.kind, cat:row.cat, person:row.person, incType:row.incType};
        }

      manualDel.forEach(m=>ops.push({ref:db.collection(m.coll).doc(m.id), del:true}));
      // O Firestore aceita no máximo 500 operações por batch: grava em blocos de 400.
      for(let i=0;i<ops.length;i+=400){
        const b = db.batch();
        ops.slice(i,i+400).forEach(o=>{ if(o.del) b.delete(o.ref); else b.set(o.ref,o.data); });

      for(let i=0;i<ruleList.length;i+=400){

                                </select>
                                <input type="number" value={efBillSel.year} onChange={e=>setEfBillSel(b=>({...b,year:parseInt(e.target.value,10)||b.year}))} style={{...SS,width:72}}/>
                                <button onClick={()=>setEfBillSel(b=>({...b,on:false}))} style={{background:"transparent",border:"none",fontSize:12,fontWeight:700,color:"#5233E8",cursor:"pointer"}}>Usar a estimativa</button>
                              </>}
                        </div>
                      </div>
                    );
                  })()}
                </div>

                <button onClick={addExp} disabled={syncing} style={{opacity:syncing?0.6:1,background:"#E8544A",border:"none",borderRadius:18,padding:"15px",color:"#fff",fontSize:16,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 14px rgba(232,84,74,0.35)",letterSpacing:0.3}}>Lançar Gasto</button>
              </div>
            )}

            {mode==="income"&&(
              <div style={{display:"flex",flexDirection:"column",gap:14}}>

                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <div style={{position:"relative"}}>
                      <span style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",color:"#5A5680",fontSize:13,fontWeight:600}}>R$</span>
                      <input placeholder="0,00" type="number" min="0" value={inf.amt} onChange={e=>setInf(f=>({...f,amt:e.target.value}))} style={{...IS,paddingLeft:36}}/>
                    </div>
                    <input type="date" value={inf.date} onChange={e=>setInf(f=>({...f,date:e.target.value}))} style={IS}/>
                  </div>
                </div>

                <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow,border:"1px solid #ECE9FF"}}>
                  <div style={{fontSize:11,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Quem recebeu</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {PERSONS.map(p=>(
                      <button key={p.id} onClick={()=>setInf(f=>({...f,person:p.id}))} style={{background:inf.person===p.id?p.color:p.color+"10",border:"2px solid "+(inf.person===p.id?p.color:p.color+"25"),borderRadius:12,padding:"12px 8px",color:inf.person===p.id?"#fff":p.color,fontSize:14,fontWeight:700,cursor:"pointer",transition:"all 0.15s"}}>{p.name}</button>
                    ))}
                  </div>
                </div>

                <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow,border:"1px solid #ECE9FF"}}>
                  <div style={{fontSize:11,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Tipo de entrada</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7}}>
                    {ITYPES.map(t=>(
                      <button key={t.id} onClick={()=>setInf(f=>({...f,type:t.id}))} style={{background:inf.type===t.id?t.c+"18":"#F9F9F9",border:"1.5px solid "+(inf.type===t.id?t.c:"#EBEBEB"),borderRadius:12,padding:"9px 4px",fontSize:20,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"all 0.15s"}}>
                        <Ico k={t.e} size={22} color={inf.type===t.id?t.c:"#5A5680"}/>
                        <span style={{fontSize:8,color:inf.type===t.id?t.c:"#5A5680",fontWeight:inf.type===t.id?700:400,textAlign:"center"}}>{t.l}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <button onClick={addInc} disabled={syncing} style={{opacity:syncing?0.6:1,background:"#00A86B",border:"none",borderRadius:18,padding:"15px",color:"#fff",fontSize:16,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 14px rgba(0,168,107,0.35)",letterSpacing:0.3}}>Registrar Entrada</button>
              </div>
            )}
          </div>
        )}

        {/* ══ IMPORTAR ══ */}
        {tab==="import"&&(
          <div style={{animation:"fadeIn 0.2s ease"}}>
            <div style={{background:"#fff",borderRadius:22,padding:16,marginBottom:14,boxShadow:shadow,border:"1px solid #ECE9FF"}}>
              <div style={{fontSize:11,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:8}}>Importar lançamentos</div>
              <div style={{fontSize:12,color:"#5A5680",lineHeight:1.6,marginBottom:14}}>
                Envie um arquivo <strong>.csv</strong> ou <strong>.xlsx</strong> com as colunas: <strong>data</strong> (AAAA-MM-DD), <strong>descricao</strong>, <strong>valor</strong>, <strong>tipo</strong> (gasto/entrada) e <strong>origem</strong> (corrente, card1, card2 ou card3). Para gastos de cartão, você pode incluir também a coluna opcional <strong>fatura</strong> (AAAA-MM) informando o mês exato da fatura — evita erro de arredondamento quando a compra é no fim do mês. Se não vier preenchida, o app estima pelo dia de fechamento do cartão e avisa na revisão.
              </div>
              <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{display:"none"}}/>
              <button onClick={()=>fileInputRef.current&&fileInputRef.current.click()} style={{background:"#5233E8",border:"none",borderRadius:18,padding:"14px",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",width:"100%",boxShadow:"0 4px 14px rgba(82,51,232,0.3)"}}><IcoLabel k="upload" size={18} gap={8}>Escolher arquivo</IcoLabel></button>
              {importErr&&<div style={{marginTop:10,background:"#FFF0EF",color:"#E8544A",borderRadius:10,padding:"9px 12px",fontSize:12,fontWeight:600}}>{importErr}</div>}
            </div>

            {reviewRows.length>0&&(
              <>
                <div style={{background:"#EFEBFF",borderRadius:18,padding:"12px 16px",marginBottom:12,border:"1px solid #D9CFFF",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:"#5233E8"}}>{effRows.length} a importar · {reviewRows.length} no arquivo</div>
                    <div style={{fontSize:11,color:"#5233E8",marginTop:2}}>{matchedCount} já com categoria aprendida{dupSkipped>0?" · "+dupSkipped+" duplicados ignorados":""}{invalidCount>0?" · "+invalidCount+" inválidos":""}{paySkipped>0?" · "+paySkipped+" pagamentos de fatura ignorados":""}{manualCount>0?" · "+manualCount+" manuais a substituir":""}</div>
                  </div>
                  <div style={{fontSize:16,fontWeight:800,color:importTotal>=0?"#00A86B":"#E8544A"}}>{fmt(importTotal)}</div>
                </div>

                {importSummary.length>0&&(
                  <div style={{background:"#fff",borderRadius:18,padding:"12px 14px",marginBottom:10,boxShadow:shadow,border:"1px solid #ECE9FF"}}>
                    <div style={{fontSize:10,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>Conferência — digite o total da fatura/extrato</div>
                    {importSummary.map(g=>{
                      const raw=expTotals[g.key];
                      const has=raw!==undefined&&String(raw).trim()!=="";
                      const diff=has?g.fileTotal-parseAmount(raw):0;
                      const okTot=has&&Math.abs(diff)<0.005;
                      return (
                        <div key={g.key} style={{padding:"8px 0",borderTop:"1px solid #F3F3F3"}}>
                          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
                            <span style={{color:"#4a4a6a",fontWeight:600}}>{g.label} <span style={{color:"#5A5680",fontWeight:500}}>({g.fileCount})</span></span>
                            <span style={{fontWeight:800,color:"#17133A"}}>{fmt(g.fileTotal)}</span>
                          </div>
                          {g.newCount!==g.fileCount&&<div style={{fontSize:11,color:"#5A5680",marginTop:2}}>A importar: {g.newCount} · {fmt(g.newTotal)} (o restante já existe ou será ignorado)</div>}
                          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
                            <input inputMode="decimal" placeholder="Total esperado (opcional)" value={raw??""} onChange={e=>setExpTotals(t=>({...t,[g.key]:e.target.value}))} style={{...SS,flex:1,minWidth:0}}/>
                            {has&&<span style={{fontSize:12,fontWeight:700,color:okTot?"#00A86B":"#E8544A",whiteSpace:"nowrap"}}>{okTot?"✓ confere":"Δ "+fmt(diff)}</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {autoBillCount>0&&(
                  <div style={{background:"#FFF8E6",borderRadius:18,padding:"12px 14px",marginBottom:10,border:"1px solid #F5E1A4"}}>

                    <div style={{fontSize:11,color:"#B7791F",lineHeight:1.6,marginBottom:8}}>O mês da fatura foi estimado pelo dia de fechamento. Como um arquivo costuma ser uma única fatura, escolha o mês correto e aplique a todas:</div>
                    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      <select value={bulkBill.month} onChange={e=>setBulkBill(b=>({...b,month:parseInt(e.target.value,10)}))} style={SS}>
                        {MONTHS.map((m,i)=><option key={i} value={i}>Fatura {m}</option>)}
                      </select>
                      <input type="number" value={bulkBill.year} onChange={e=>setBulkBill(b=>({...b,year:parseInt(e.target.value,10)||b.year}))} style={{...SS,width:72}}/>
                      <button onClick={()=>setReviewRows(rows=>rows.map(r=>{
                        const isC=PMS.find(p=>p.id===r.pm)?.isCard;
                        return (isC && r.billSource!=="csv" && r.billSource!=="manual" && !r.invalid) ? {...r,billMonth:bulkBill.month,billYear:bulkBill.year,billSource:"lote"} : r;
                      }))} style={{background:"#B7791F",border:"none",borderRadius:10,padding:"9px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>Aplicar</button>
                    </div>
                  </div>
                )}

                {reviewRows.map((row,idx)=>(
                  <div key={row._tmpId} style={{background:"#fff",borderRadius:18,padding:"12px 14px",marginBottom:8,boxShadow:shadow,border:"1px solid "+(rowStatus[idx]&&rowStatus[idx].skip?"#F5C6C2":"#EBEBEB"),opacity:rowStatus[idx]&&rowStatus[idx].skip?0.55:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8,gap:8}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#17133A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.desc||"(sem descrição)"}</div>
                        <div style={{fontSize:11,color:"#5A5680",marginTop:2}}>{(row.date||"").split("-").reverse().join("/")} · {PMS.find(p=>p.id===row.pm)?.l}</div>
                      </div>
                      <div style={{fontSize:14,fontWeight:800,color:row.kind==="gasto"?"#E8544A":"#00A86B",flexShrink:0}}>{row.kind==="gasto"?"-":"+"}{fmt(row.amount)}</div>
                    </div>
                    {row.matched&&<div style={{fontSize:10,color:"#5233E8",background:"#EFEBFF",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:600}}>✓ categoria aprendida</div>}
                    {rowStatus[idx]&&rowStatus[idx].invalid&&<div style={{fontSize:10,color:"#E8544A",background:"#FFF0EF",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:700}}>✕ data ou valor inválido — será ignorada</div>}
                    {rowStatus[idx]&&rowStatus[idx].dup&&!rowStatus[idx].invalid&&(
                      <div style={{display:"inline-flex",alignItems:"center",gap:6,marginBottom:8,marginRight:6}}>
                        <span style={{fontSize:10,color:"#E8544A",background:"#FFF0EF",padding:"2px 8px",borderRadius:20,fontWeight:700}}><Ico k="alert" size={11} mr={3}/>já importado</span>
                        <button onClick={()=>updateRow(idx,{forceInclude:!row.forceInclude})} style={{fontSize:10,background:"transparent",border:"1px solid #E8E8E8",borderRadius:20,padding:"2px 8px",color:"#5A5680",cursor:"pointer",fontWeight:600}}>{row.forceInclude?"Ignorar":"Importar mesmo assim"}</button>
                      </div>
                    )}
                    {rowStatus[idx]&&rowStatus[idx].payment&&!rowStatus[idx].invalid&&(
                      <div style={{display:"inline-flex",alignItems:"center",gap:6,marginBottom:8,marginRight:6}}>
                        <span style={{fontSize:10,color:"#5233E8",background:"#EFEBFF",padding:"2px 8px",borderRadius:20,fontWeight:700}}><Ico k="card" size={12} mr={4}/>pagamento de fatura — ignorado (evita contar em dobro)</span>
                        <button onClick={()=>updateRow(idx,{forceInclude:!row.forceInclude})} style={{fontSize:10,background:"transparent",border:"1px solid #E8E8E8",borderRadius:20,padding:"2px 8px",color:"#5A5680",cursor:"pointer",fontWeight:600}}>{row.forceInclude?"Ignorar":"Importar mesmo assim"}</button>
                      </div>
                    )}
                    {rowStatus[idx]&&rowStatus[idx].manual&&(
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:8}}>
                        <span style={{fontSize:10,color:"#B7791F",background:"#FFF8E6",padding:"2px 8px",borderRadius:20,fontWeight:700}}>{"parece o lançamento manual “"+rowStatus[idx].manual.desc+"” de "+(rowStatus[idx].manual.date||"").split("-").reverse().join("/")}</span>
                        {[["replace","Substituir o manual"],["keep","Manter os dois"]].map(([v,l])=>{
                          const on=(row.manualAction||"replace")===v;
                          return <button key={v} onClick={()=>updateRow(idx,{manualAction:v})} style={{fontSize:10,background:on?"#17133A":"transparent",color:on?"#fff":"#5A5680",border:"1px solid "+(on?"#17133A":"#E8E8E8"),borderRadius:20,padding:"2px 8px",cursor:"pointer",fontWeight:600}}>{l}</button>;
                        })}
                      </div>
                    )}
                    {PMS.find(p=>p.id===row.pm)?.isCard&&row.billSource==="auto"&&<div style={{fontSize:10,color:"#B7791F",background:"#FFF8E6",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:600}}>{row.isInstallment?"parcela — confira a fatura":"fatura estimada"}</div>}
                    {PMS.find(p=>p.id===row.pm)?.isCard&&row.billSource==="lote"&&<div style={{fontSize:10,color:"#5233E8",background:"#EFEBFF",display:"inline-block",padding:"2px 8px",borderRadius:20,marginBottom:8,marginRight:6,fontWeight:600}}>fatura do lote</div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      <select value={row.kind} onChange={e=>updateRow(idx,{kind:e.target.value})} style={SS}>
                        <option value="gasto">↓ Gasto</option>
                        <option value="entrada">↑ Entrada</option>
                      </select>
                      <select value={row.person} onChange={e=>updateRow(idx,{person:e.target.value})} style={SS}>
                        {PERSONS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      {row.kind==="gasto"
                        ? <select value={row.cat} onChange={e=>updateRow(idx,{cat:e.target.value})} style={SS}>
                            {CATS.map(c=><option key={c.id} value={c.id}>{c.l}</option>)}
                          </select>
                        : <select value={row.incType} onChange={e=>updateRow(idx,{incType:e.target.value})} style={SS}>
                            {ITYPES.map(t=><option key={t.id} value={t.id}>{t.l}</option>)}
                          </select>
                      }
                      <select value={row.pm} onChange={e=>{
                        const newPm = e.target.value;
                        const isCard = PMS.find(p=>p.id===newPm)?.isCard||false;
                        const patch = {pm:newPm};
                        if(isCard && (row.billMonth==null||row.billYear==null)){
                          const b = billingFor(row.date, newPm);
                          patch.billMonth = b.month; patch.billYear = b.year; patch.billSource = "auto";
                        }
                        updateRow(idx,patch);
                      }} style={SS}>
                        {PMS.map(p=><option key={p.id} value={p.id}>{p.l}</option>)}
                      </select>
                      {PMS.find(p=>p.id===row.pm)?.isCard && (
                        <>
                          <select value={row.billMonth ?? ""} onChange={e=>updateRow(idx,{billMonth:parseInt(e.target.value,10),billSource:"manual"})} style={SS} title="Mês da fatura">
                            {MONTHS.map((m,i)=><option key={i} value={i}>Fatura {m}</option>)}
                          </select>
                          <input type="number" value={row.billYear ?? ""} onChange={e=>updateRow(idx,{billYear:parseInt(e.target.value,10),billSource:"manual"})} style={{...SS,width:72}} title="Ano da fatura"/>
                        </>
                      )}
                      <button onClick={()=>removeRow(idx)} style={{background:"transparent",border:"none",color:"#D92D6F",fontSize:16,cursor:"pointer",marginLeft:"auto"}}><Ico k="trash" size={18}/></button>
                    </div>
                  </div>
                ))}

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:14}}>
                  <button onClick={clearImport} style={{background:"#F3F1FF",border:"none",borderRadius:18,padding:"15px",color:"#17133A",fontSize:15,fontWeight:700,cursor:"pointer"}}>Cancelar</button>
                  <button onClick={confirmImport} disabled={syncing} style={{background:"#5233E8",border:"none",borderRadius:18,padding:"15px",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 14px rgba(82,51,232,0.35)",opacity:syncing?0.6:1}}>{syncing?"Salvando...":"Confirmar Importação"}</button>
                </div>
              </>
            )}

            <div style={{background:"#fff",borderRadius:22,padding:16,marginTop:14,boxShadow:shadow,border:"1px solid #ECE9FF"}}>
              <div style={{fontSize:11,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Importações recentes</div>
              {importBatches.length===0&&<div style={{fontSize:12,color:"#5A5680"}}>Nenhuma importação encontrada.</div>}
              {importBatches.map(b=>{
                const when=b.createdAt?new Date(b.createdAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"data desconhecida";
                const pmsL=Object.keys(b.pms).map(id=>PMS.find(p=>p.id===id)?.l||id).join(", ");
                const fats=Object.keys(b.faturas).join(", ");
                return (
                  <div key={b.id} style={{padding:"10px 0",borderTop:"1px solid #F3F3F3"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#17133A"}}>{when}{b.legacy?" · importação antiga":""}</div>
                        <div style={{fontSize:11,color:"#5A5680",marginTop:2,lineHeight:1.5}}>
                          {b.exp.length>0&&<span>{b.exp.length} gastos · {fmt(b.gTotal)}{pmsL?" · "+pmsL:""}{fats?" · fatura "+fats:""}</span>}
                          {b.exp.length>0&&b.inc.length>0&&<br/>}
                          {b.inc.length>0&&<span>{b.inc.length} entradas · {fmt(b.iTotal)}</span>}
                        </div>
                      </div>
                      {undoId===b.id
                        ? <div style={{display:"flex",gap:6,flexShrink:0}}>
                            <button onClick={()=>setUndoId(null)} style={{background:"#F3F1FF",border:"none",borderRadius:10,padding:"7px 10px",fontSize:12,fontWeight:700,color:"#17133A",cursor:"pointer"}}>Não</button>
                            <button disabled={syncing} onClick={()=>undoImport(b)} style={{background:"#E8544A",border:"none",borderRadius:10,padding:"7px 10px",fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer",opacity:syncing?0.6:1}}>Apagar {b.exp.length+b.inc.length}</button>
                          </div>
                        : <button onClick={()=>setUndoId(b.id)} style={{background:"transparent",border:"1px solid #F5C6C2",borderRadius:10,padding:"7px 10px",fontSize:12,fontWeight:700,color:"#E8544A",cursor:"pointer",flexShrink:0}}>Desfazer</button>}
                    </div>
                  </div>
                );
              })}
              <div style={{fontSize:10,color:"#B0B0C0",marginTop:8,lineHeight:1.5}}>Desfazer apaga todos os lançamentos daquela importação. As categorias aprendidas são mantidas.</div>
            </div>

            <div style={{background:"#fff",borderRadius:22,padding:16,marginTop:14,boxShadow:shadow,border:"1px solid #ECE9FF"}}>
              <div style={{fontSize:11,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Backup e conta</div>
              <button onClick={downloadBackup} style={{background:"#17133A",border:"none",borderRadius:18,padding:"13px",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",width:"100%"}}><IcoLabel k="download" size={18} gap={8}>Baixar backup (JSON)</IcoLabel></button>
              <div style={{fontSize:11,color:"#5A5680",marginTop:6}}>{lastBackup?"Último backup: "+new Date(lastBackup).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"Nenhum backup baixado neste aparelho ainda."}</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:14,paddingTop:12,borderTop:"1px solid #F3F3F3"}}>
                <span style={{fontSize:12,color:"#5A5680",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginRight:8}}>{user&&user.email}</span>

            </div>
          </div>

        {/* ══ DASHBOARD ══ */}

                      <span style={{fontSize:13,fontWeight:700}}>{p.name}</span>
                      <span style={{fontSize:14,fontWeight:800,color:b>=0?"#12A06B":"#D92D6F"}}>{fmt(b)}</span>
                      <span style={{fontSize:11,color:"#5A5680",fontWeight:600}}>↑{numK(inc)} ↓{numK(deb)}</span>

                </div>
              </div>
            </div>

            {totPending>0&&(
              <div style={{background:"#5233E8",color:"#fff",borderRadius:22,padding:"16px 18px",display:"flex",flexDirection:"column",gap:10}}>

                  return (
                    <div key={p.id} style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:600,borderTop:"1px solid rgba(255,255,255,0.28)",paddingTop:10}}>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div style={{background:"#fff",borderRadius:18,padding:"13px 14px",boxShadow:shadow}}>
                <div style={{fontSize:12,color:"#12A06B",fontWeight:800,marginBottom:4}}>Corrente</div>
                <div style={{fontSize:17,fontWeight:800}}>{fmt(debitExp.filter(e=>!e.isCard).reduce((s,e)=>s+e.amount,0))}</div>
                <div style={{fontSize:11,color:"#5A5680",marginTop:3}}>Débitos diretos</div>
              </div>
              <div style={{background:"#fff",borderRadius:18,padding:"13px 14px",boxShadow:shadow}}>
                <div style={{fontSize:12,color:"#5233E8",fontWeight:800,marginBottom:4}}>Faturas</div>
                <div style={{fontSize:17,fontWeight:800}}>{fmt(debitExp.filter(e=>e.isCard).reduce((s,e)=>s+e.amount,0))}</div>
                <div style={{fontSize:11,color:"#5A5680",marginTop:3}}>Faturas debitadas no mês</div>
              </div>
            </div>

            {byType.length>0&&(
              <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow}}>
                <div style={{fontSize:12,color:"#5A5680",fontWeight:800,marginBottom:12}}>Entradas por tipo</div>

                      <span style={{fontSize:13,fontWeight:600}}><IcoLabel k={t.e}>{t.l}</IcoLabel></span>
                      <span style={{fontSize:13,fontWeight:700,color:t.c}}>{fmt(t.total)}</span>
                    </div>
                    <Bar value={t.total} max={maxType} color={t.c}/>

              </div>

            <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow}}>

              {byCat.length===0&&<div style={{color:"#5A5680",textAlign:"center",padding:"16px 0",fontSize:13}}>Sem débitos neste mês</div>}

                <div key={c.id} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:13,fontWeight:600}}><IcoLabel k={c.e}>{c.l}</IcoLabel></span>
                    <span style={{fontSize:13,fontWeight:700,color:c.c}}>{fmt(c.total)}</span>
                  </div>
                  <Bar value={c.total} max={maxCat} color={c.c}/>
                  <div style={{fontSize:11,color:"#5A5680",marginTop:3}}>{totMExp>0?((c.total/totMExp)*100).toFixed(1):0}% dos gastos</div>
                </div>
              ))}
            </div>
          </div>

              </div>
            )}
            {!budEdit&&budRows.map(r=>{
              const col = r.ratio>=1?"#D92D6F":r.ratio>=0.9?"#E0A800":"#12A06B";
              const tcol = r.ratio>=1?"#B01E55":r.ratio>=0.9?"#7A5A00":"#0B7A55";
              const msg = r.ratio>=1 ? "acima do teto · "+fmt(r.spent-r.limit)+" a mais" : (r.ratio>=0.9?"atenção":"dentro do teto")+" · faltam "+fmt(r.limit-r.spent);
              return (
                <div key={r.id} style={{background:"#fff",borderRadius:18,padding:"12px 14px",boxShadow:shadow,display:"flex",flexDirection:"column",gap:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
                    <span style={{fontSize:15,fontWeight:800}}><IcoLabel k={r.e}>{r.l}</IcoLabel></span>
                    <span style={{fontSize:13,fontWeight:700,color:"#5A5680"}}>{numK(r.spent)} de {numK(r.limit)}</span>
                  </div>
                  <div style={{height:10,borderRadius:99,background:"#ECE9FF"}}><div style={{width:Math.min(100,r.ratio*100)+"%",height:10,borderRadius:99,background:col}}/></div>

                </div>

            {!budEdit&&budRows.length>0&&budOther>0&&<div style={{fontSize:12,color:"#5A5680",fontWeight:600,padding:"0 4px"}}>Sem teto definido: {fmt(budOther)} gastos em outras categorias.</div>}
            {budEdit&&(
              <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow,display:"flex",flexDirection:"column",gap:10}}>
                <div style={{fontSize:12,color:"#5A5680",fontWeight:800}}>Teto mensal por categoria (deixe vazio para não ter teto)</div>
                {CATS.map(c=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{flex:1,fontSize:14,fontWeight:700}}><IcoLabel k={c.e}>{c.l}</IcoLabel></span>
                    <div style={{position:"relative",width:150}}>
                      <span style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",color:"#5A5680",fontSize:13,fontWeight:600}}>R$</span>
                      <input inputMode="decimal" placeholder="sem teto" value={budDraft[c.id]??""} onChange={e=>setBudDraft(d=>({...d,[c.id]:e.target.value}))} style={{...IS,paddingLeft:38,minHeight:44}}/>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div style={{display:"flex",gap:10,marginTop:2}}>

            </div>
          </div>

        {/* ══ LISTA ══ */}

              {[["expense","↓ Gastos"],["income","↑ Entradas"]].map(([m,l])=>(
                <button key={m} onClick={()=>setMode(m)} style={{background:mode===m?"#17133A":"transparent",border:"none",borderRadius:11,padding:"10px",color:mode===m?"#fff":"#5A5680",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all 0.2s"}}>{l}</button>
              ))}
            </div>

            {mode==="expense"&&(
              <>
                <div style={{background:"#EFEBFF",borderRadius:12,padding:"9px 14px",marginBottom:12,fontSize:12,color:"#5233E8",fontWeight:500}}>
                  {fPmIsCard ? `Fatura de ${MONTHS[month]} — compras que debitam em ${MONTHS[month]}` : `Gastos lançados em ${MONTHS[month]} — cartões debitam em ${MONTHS[month===11?0:month+1]}`}
                </div>
                <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                  <select value={fPer} onChange={e=>setFPer(e.target.value)} style={SS}><option value="all">Todos</option>{PERSONS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
                  <select value={fCat} onChange={e=>setFCat(e.target.value)} style={SS}><option value="all">Categoria</option>{CATS.map(c=><option key={c.id} value={c.id}>{c.l}</option>)}</select>
                  <select value={fPm}  onChange={e=>setFPm(e.target.value)}  style={SS}><option value="all">Pagamento</option>{PMS.map(p=><option key={p.id} value={p.id}>{p.l}</option>)}</select>
                </div>
                <div style={{fontSize:12,color:"#5A5680",marginBottom:10,fontWeight:500}}>{fExp.length} lançamentos — {fmt(fExp.reduce((s,e)=>s+e.amount,0))}</div>
                {fExp.length===0&&<div style={{color:"#5A5680",textAlign:"center",padding:"40px 0",fontSize:14}}>Nenhum gasto encontrado</div>}
                {fExp.map(e=>{
                  const cat=CATS.find(c=>c.id===e.cat);
                  const pm=PMS.find(p=>p.id===e.pm);
                  const per=PERSONS.find(p=>p.id===e.person);
                  return (
                    <div key={e.id} style={{background:"#fff",borderRadius:18,padding:"13px 14px",marginBottom:8,boxShadow:shadow,border:"1px solid #ECE9FF",display:"flex",alignItems:"flex-start",gap:12,animation:"fadeIn 0.2s ease"}}>
                      <div style={{width:42,height:42,borderRadius:12,background:(cat?.c||"#94A3B8")+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}><Ico k={cat?.e||"box"} size={22} color={cat?.c||"#94A3B8"}/></div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",gap:5,marginBottom:5,flexWrap:"wrap"}}>
                          <span style={{fontSize:11,background:per?.color+"15",color:per?.color,borderRadius:20,padding:"2px 9px",fontWeight:700}}>{per?.name}</span>
                          {e.isCard&&<span style={{fontSize:11,background:"#EFEBFF",color:"#5233E8",borderRadius:20,padding:"2px 9px",fontWeight:600}}><Ico k="card" size={13} mr={4}/>Débito em {e.billMonth!=null?MONTHS[e.billMonth]:""}</span>}
                        </div>
                        <div style={{fontSize:14,fontWeight:700,color:"#17133A",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.desc}</div>
                        <div style={{fontSize:12,color:"#5A5680",marginTop:3}}>{cat?.l} · {pm?.l} · {(e.date||"").split("-").reverse().join("/")}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
                        <span style={{fontSize:15,fontWeight:800,color:e.isCard?"#5233E8":cat?.c||"#17133A"}}>{fmt(e.amount)}</span>

                          <button aria-label="Editar" onClick={()=>setEditExp(e)} style={{background:"transparent",border:"none",color:"#5A5680",fontSize:15,cursor:"pointer",padding:"10px 8px",lineHeight:1}}><Ico k="edit" size={18}/></button>
                          <button aria-label="Excluir" onClick={()=>setConfirmDel({msg:e.desc+" — "+fmt(e.amount),onConfirm:()=>delExp(e.id)})} style={{background:"transparent",border:"none",color:"#D92D6F",fontSize:17,cursor:"pointer",padding:"10px 8px",lineHeight:1}}><Ico k="trash" size={18}/></button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </>
            )}

            {mode==="income"&&(
              <>
                <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                  <select value={fPer}  onChange={e=>setFPer(e.target.value)}  style={SS}><option value="all">Todos</option>{PERSONS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
                  <select value={fType} onChange={e=>setFType(e.target.value)} style={SS}><option value="all">Tipo</option>{ITYPES.map(t=><option key={t.id} value={t.id}>{t.l}</option>)}</select>
                </div>
                <div style={{fontSize:12,color:"#5A5680",marginBottom:10,fontWeight:500}}>{fInc.length} entradas — {fmt(fInc.reduce((s,i)=>s+i.amount,0))}</div>

                {fInc.map(i=>{

                  return (
                    <div key={i.id} style={{background:"#fff",borderRadius:18,padding:"13px 14px",marginBottom:8,boxShadow:shadow,border:"1px solid #ECE9FF",display:"flex",alignItems:"center",gap:12,animation:"fadeIn 0.2s ease"}}>
                      <div style={{width:42,height:42,borderRadius:12,background:(tp?.c||"#00A86B")+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}><Ico k={tp?.e||"box"} size={22} color={tp?.c||"#00A86B"}/></div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{marginBottom:5}}><span style={{fontSize:11,background:per?.color+"15",color:per?.color,borderRadius:20,padding:"2px 9px",fontWeight:700}}>{per?.name}</span></div>
                        <div style={{fontSize:14,fontWeight:700,color:"#17133A",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{i.desc}</div>
                        <div style={{fontSize:12,color:"#5A5680",marginTop:3}}>{tp?.l} · {(i.date||"").split("-").reverse().join("/")}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                        <span style={{fontSize:15,fontWeight:800,color:"#00A86B"}}>+{fmt(i.amount)}</span>

                          <button aria-label="Editar" onClick={()=>setEditInc(i)} style={{background:"transparent",border:"none",color:"#5A5680",fontSize:15,cursor:"pointer",padding:"10px 8px"}}><Ico k="edit" size={18}/></button>

                        </div>
                      </div>
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}

        {/* ══ MESES ══ */}
        {tab==="cmp"&&cmpView==="evo"&&(
          <div style={{animation:"fadeIn 0.2s ease",display:"flex",flexDirection:"column",gap:12}}>
            <div style={{background:"#fff",borderRadius:22,padding:"14px 12px 12px",boxShadow:shadow,display:"flex",flexDirection:"column",gap:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0 6px",gap:8}}>
                <span style={{fontSize:12,fontWeight:800,color:"#5A5680"}}>RECEITA × DESPESA</span>
                <div style={{display:"flex",gap:6}}>
                  {[6,12].map(n=>(
                    <button key={n} onClick={()=>setEvoRange(n)} style={{minHeight:44,minWidth:44,padding:"0 12px",border:0,borderRadius:999,background:evoRange===n?"#17133A":"#F3F1FF",color:evoRange===n?"#fff":"#5A5680",fontSize:12,fontWeight:evoRange===n?800:700,cursor:"pointer"}}>{n} meses</button>
                  ))}
                </div>
              </div>
              {evo.n===0
                ? <div style={{padding:"28px 10px",textAlign:"center",color:"#5A5680",fontSize:13}}>Ainda não há lançamentos nesse período.</div>

              <div style={{display:"flex",gap:16,padding:"0 6px",fontSize:12,fontWeight:700,color:"#5A5680"}}>
                <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:14,height:4,borderRadius:2,background:"#12A06B"}}/>Receita</span>
                <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:14,height:4,borderRadius:2,background:"#5233E8"}}/>Despesa</span>
              </div>
            </div>
            <div style={{display:"flex",gap:10}}>
              <div style={{flex:1,background:"#7BE0B0",color:"#0C3B2A",borderRadius:16,padding:"10px 12px",display:"flex",flexDirection:"column",gap:1}}><span style={{fontSize:12,fontWeight:700}}>Receita média</span><span style={{fontSize:16,fontWeight:800}}>{numK(evo.avgR)}</span></div>
              <div style={{flex:1,background:"#FFD84D",color:"#3B2E00",borderRadius:16,padding:"10px 12px",display:"flex",flexDirection:"column",gap:1}}><span style={{fontSize:12,fontWeight:700}}>Despesa média</span><span style={{fontSize:16,fontWeight:800}}>{numK(evo.avgD)}</span></div>
              <div style={{flex:1,background:"#FF9EC4",color:"#4A0A2A",borderRadius:16,padding:"10px 12px",display:"flex",flexDirection:"column",gap:1}}><span style={{fontSize:12,fontWeight:700}}>Poupança</span><span style={{fontSize:16,fontWeight:800}}>{evo.save==null?"—":evo.save.toFixed(1).replace(".",",")+"%"}</span></div>
            </div>
            {(()=>{
              const base=mkey(month,year), items=[1,2,3,4].map(j=>({k:base+j, v:inst.commit[base+j]||0}));
              const mx=Math.max(1,...items.map(x=>x.v));
              return (
                <div style={{background:"#fff",borderRadius:22,padding:"14px 16px",boxShadow:shadow,display:"flex",flexDirection:"column",gap:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                    <span style={{fontSize:12,fontWeight:800,color:"#5A5680"}}>JÁ COMPROMETIDO NOS PRÓXIMOS MESES</span>
                    <button onClick={()=>setCmpView("parc")} style={{minHeight:44,border:0,background:"none",fontSize:12,fontWeight:700,color:"#5233E8",cursor:"pointer"}}>parcelas ›</button>
                  </div>
                  {inst.left<=0
                    ? <div style={{fontSize:13,color:"#5A5680"}}>Nenhuma parcela futura encontrada.</div>
                    : <div style={{display:"flex",alignItems:"flex-end",gap:12,height:96}}>
                        {items.map(x=>(
                          <div key={x.k} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,justifyContent:"flex-end",height:"100%"}}>
                            <span style={{fontSize:11,fontWeight:800}}>{numK(x.v)}</span>
                            <div style={{width:"100%",height:Math.max(4,Math.round(x.v/mx*52)),borderRadius:10,background:"#5233E8"}}/>
                            <span style={{fontSize:11,fontWeight:600,color:"#5A5680"}}>{MONTHS[((x.k%12)+12)%12]}</span>

                        ))}
                      </div>}
                </div>
              );
            })()}
          </div>
        )}

        {tab==="cmp"&&cmpView==="parc"&&(

                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                      <span style={{fontSize:14,fontWeight:800,color:delta<0?"#E8544A":t.c}}>{delta<0?"−":"+"}{fmt(Math.abs(delta))}</span>
                      <button aria-label="Editar movimentação" onClick={()=>setEditMov(c)} style={{background:"transparent",border:"none",fontSize:15,cursor:"pointer"}}><Ico k="edit" size={18}/></button>
                    </div>
                  </div>
                );
              })}
              {!showAllMov&&movList.length>30&&<button onClick={()=>setShowAllMov(true)} style={{marginTop:8,width:"100%",background:"#F3F1FF",border:"none",borderRadius:10,padding:10,fontSize:12,fontWeight:700,color:"#5233E8",cursor:"pointer"}}>Mostrar todas ({movList.length})</button>}
            </div>

            {/* Resumo por mês */}
            {cByM.length>0&&(
              <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow,border:"1px solid #ECE9FF"}}>
                <div style={{fontSize:11,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>Resumo por mês</div>
                {cByM.map((c,i)=>(
                  <div key={i} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:13,fontWeight:600,color:"#17133A"}}>{c.label}</span>
                      <span style={{fontSize:13,fontWeight:700,color:"#00A86B"}}>{fmt(c.total)}</span>
                    </div>
                    <Bar value={c.total} max={maxC} color="#00A86B"/>
                    {(c.rend!==0||c.ret!==0)&&(
                      <div style={{fontSize:11,color:"#5A5680",marginTop:5}}>
                        {c.rend!==0&&<span>Rendimentos: <span style={{color:c.rend<0?"#E8544A":"#5233E8",fontWeight:700}}>{fmt(c.rend)}</span></span>}
                        {c.rend!==0&&c.ret!==0&&" · "}
                        {c.ret!==0&&<span>Retiradas: <span style={{color:"#E8544A",fontWeight:700}}>{fmt(c.ret)}</span></span>}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
            </>)}
          </div>
        )}

      </div>
    </div>
  );
}

function EditAccModal({acc, onSave, onClose}) {
  const [f, setF] = useState({id:acc.id, name:acc.name||"", inst:acc.inst||"", bal:String(parseFloat((acc.balance||0).toFixed(2))), recDiff:true});
  const newBal = parseFloat(f.bal);
  const diff = isNaN(newBal) ? 0 : parseFloat((newBal-acc.balance).toFixed(2));
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
      <div style={{background:"#F3F1FF",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:430,maxHeight:"90vh",overflowY:"auto",padding:"20px 14px calc(40px + env(safe-area-inset-bottom))",animation:"slideDown 0.25s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div style={{fontSize:16,fontWeight:800,color:"#17133A"}}><IcoLabel k="edit" size={18}>Editar conta</IcoLabel></div>
          <button onClick={onClose} style={{background:"#EBEBEB",border:"none",borderRadius:22,width:44,height:44,fontSize:16,cursor:"pointer",color:"#5A5680",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico k="x" size={18}/></button>
        </div>
        <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow,border:"1px solid #ECE9FF",display:"flex",flexDirection:"column",gap:12}}>
          <input placeholder="Nome (ex: Tesouro Selic)" value={f.name} onChange={e=>setF(v=>({...v,name:e.target.value}))} style={IS}/>
          <input placeholder="Instituição (ex: XP)" value={f.inst} onChange={e=>setF(v=>({...v,inst:e.target.value}))} style={IS}/>
          <div>
            <div style={{fontSize:11,color:"#5A5680",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>Saldo atual</div>
            <input placeholder="Saldo atual" type="number" step="0.01" value={f.bal} onChange={e=>setF(v=>({...v,bal:e.target.value}))} style={IS}/>
          </div>
          {Math.abs(diff)>=0.005&&(
            <label style={{display:"flex",gap:10,alignItems:"flex-start",fontSize:12,color:"#4a4a6a",lineHeight:1.6,cursor:"pointer"}}>
              <input type="checkbox" checked={f.recDiff} onChange={e=>setF(v=>({...v,recDiff:e.target.checked}))} style={{marginTop:3}}/>
              <span>Registrar a diferença ({diff>0?"+":"−"}{fmt(Math.abs(diff))}) como <strong>rendimento</strong>. Desmarque se foi um aporte ou uma correção: aí só o saldo muda.</span>
            </label>
          )}
        </div>
        <button onClick={()=>onSave(f)} style={{marginTop:14,width:"100%",background:"#F59E0B",border:"none",borderRadius:14,padding:15,color:"#fff",fontSize:16,fontWeight:800,cursor:"pointer"}}>Salvar</button>
      </div>
    </div>
  );
}

function EditMoveModal({mov, accounts, onSave, onDelete, onClose}) {
  const [f, setF] = useState({id:mov.id, accId:mov.accId, type:mov.type||"aporte", amt:String(mov.amount), date:mov.date||todayLocal(), obs:mov.obs||""});
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
      <div style={{background:"#F3F1FF",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:430,maxHeight:"90vh",overflowY:"auto",padding:"20px 14px calc(40px + env(safe-area-inset-bottom))",animation:"slideDown 0.25s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div style={{fontSize:16,fontWeight:800,color:"#17133A"}}><IcoLabel k="edit" size={18}>Editar movimentação</IcoLabel></div>
          <button onClick={onClose} style={{background:"#EBEBEB",border:"none",borderRadius:22,width:44,height:44,fontSize:16,cursor:"pointer",color:"#5A5680",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico k="x" size={18}/></button>
        </div>
        <div style={{background:"#fff",borderRadius:22,padding:16,boxShadow:shadow,border:"1px solid #ECE9FF",display:"flex",flexDirection:"column",gap:12}}>
          <select value={f.accId} onChange={e=>setF(v=>({...v,accId:e.target.value}))} style={{...IS,padding:"13px 14px"}}>
            {accounts.map(a=><option key={a.id} value={a.id}>{a.name} — {a.inst}</option>)}
          </select>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {MOV_TYPES.map(t=>(
              <button key={t.id} onClick={()=>setF(v=>({...v,type:t.id}))} style={{background:f.type===t.id?t.c:t.c+"10",border:"2px solid "+(f.type===t.id?t.c:t.c+"25"),borderRadius:12,padding:"11px 4px",color:f.type===t.id?"#fff":t.c,fontSize:13,fontWeight:700,cursor:"pointer"}}>{t.l}</button>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <input placeholder="Valor" type="number" step="0.01" value={f.amt} onChange={e=>setF(v=>({...v,amt:e.target.value}))} style={IS}/>
            <input type="date" value={f.date} onChange={e=>setF(v=>({...v,date:e.target.value}))} style={IS}/>
          </div>
          <input placeholder="Observação (opcional)" value={f.obs} onChange={e=>setF(v=>({...v,obs:e.target.value}))} style={IS}/>
          {!mov.affectsBalance&&<div style={{fontSize:11,color:"#B7791F",background:"#FFF8E6",borderRadius:10,padding:"8px 10px",lineHeight:1.6}}>Registro antigo: editar ou apagar não altera o saldo da conta. Se precisar acertar o saldo, use "Editar" na conta.</div>}
        </div>
        <button onClick={()=>onSave(f)} style={{marginTop:14,width:"100%",background:"#5233E8",border:"none",borderRadius:14,padding:15,color:"#fff",fontSize:16,fontWeight:800,cursor:"pointer"}}>Salvar</button>
        <button onClick={onDelete} style={{marginTop:10,width:"100%",background:"transparent",border:"1px solid #F5C6C2",borderRadius:14,padding:13,color:"#E8544A",fontSize:14,fontWeight:700,cursor:"pointer"}}>Excluir movimentação</button>
      </div>
    </div>
  );
}

function LoadingScreen({text}) {
  return (
    <div style={{minHeight:"100vh",background:"#F3F1FF",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
      <Logo size={64}/>
      <div style={{fontSize:24,fontWeight:800,color:"#17133A",letterSpacing:-0.5}}>Prosperidade</div>
      <div style={{width:32,height:32,border:"3px solid #E8E8E8",borderTop:"3px solid #5233E8",borderRadius:"50%",animation:"spin 0.8s linear infinite",marginTop:8}}/>
      <div style={{color:"#5A5680",fontSize:13}}>{text}</div>
    </div>
  );
}

function LoginScreen({onLogin, onReset, error, info, busy}) {
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  return (
    <div style={{minHeight:"100vh",background:"#F3F1FF",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:360,background:"#fff",borderRadius:20,padding:24,boxShadow:shadowMd,border:"1px solid #ECE9FF"}}>
        <div style={{textAlign:"center",marginBottom:18}}>
          <Logo size={56}/>
          <div style={{fontSize:22,fontWeight:800,color:"#17133A",letterSpacing:-0.5}}>Prosperidade</div>
          <div style={{fontSize:12,color:"#5A5680",marginTop:4}}>Entre para ver as finanças da família</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input type="email" autoComplete="username" placeholder="E-mail" value={email} onChange={e=>setEmail(e.target.value)} style={IS}/>
          <input type="password" autoComplete="current-password" placeholder="Senha" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") onLogin(email,pw); }} style={IS}/>
          {error&&<div style={{background:"#FFF0EF",color:"#E8544A",borderRadius:10,padding:"9px 12px",fontSize:12,fontWeight:600}}>{error}</div>}
          {info&&<div style={{background:"#E8F8F0",color:"#00A86B",borderRadius:10,padding:"9px 12px",fontSize:12,fontWeight:600}}>{info}</div>}
          <button onClick={()=>onLogin(email,pw)} disabled={busy||!email||!pw} style={{background:"#5233E8",border:"none",borderRadius:18,padding:"14px",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",opacity:(busy||!email||!pw)?0.6:1}}>{busy?"Entrando...":"Entrar"}</button>
          <button onClick={()=>onReset(email)} style={{background:"transparent",border:"none",color:"#5233E8",fontSize:12,cursor:"pointer",fontWeight:600}}>Esqueci a senha</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [user,setUser]=useState(undefined); // undefined = verificando, null = deslogado
  const [authErr,setAuthErr]=useState("");
  const [authInfo,setAuthInfo]=useState("");
  const [busy,setBusy]=useState(false);

  useEffect(()=>auth.onAuthStateChanged(u=>{
    if(u && ALLOWED_EMAILS.length>0 && !ALLOWED_EMAILS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase())){
      setAuthErr("Este e-mail não tem acesso ao app.");
      auth.signOut();
      setUser(null);
      return;
    }
    setUser(u||null);
  }),[]);

  const authMsg = e => {
    const c = e && e.code;
    if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-email") return "E-mail ou senha incorretos.";
    if(c==="auth/too-many-requests") return "Muitas tentativas. Aguarde alguns minutos e tente de novo.";
    if(c==="auth/network-request-failed") return "Sem conexão. Verifique sua internet.";
    return "Não consegui entrar ("+(c||"erro desconhecido")+").";
  };
  const login = async (email,pw) => {
    setBusy(true); setAuthErr(""); setAuthInfo("");
    try{ await auth.signInWithEmailAndPassword(email.trim(),pw); }
    catch(e){ setAuthErr(authMsg(e)); }
    setBusy(false);
  };
  const reset = async email => {
    setAuthErr(""); setAuthInfo("");
    if(!email.trim()){ setAuthErr("Digite seu e-mail primeiro."); return; }
    try{ await auth.sendPasswordResetEmail(email.trim()); setAuthInfo("Se esse e-mail tem conta, enviei um link para redefinir a senha."); }
    catch(e){ setAuthErr(authMsg(e)); }
  };

  if(user===undefined) return <LoadingScreen text="Verificando acesso..."/>;
  if(!user) return <LoginScreen onLogin={login} onReset={reset} error={authErr} info={authInfo} busy={busy}/>;
  return <MainApp user={user} onLogout={()=>auth.signOut()}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
